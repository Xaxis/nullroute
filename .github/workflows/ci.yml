name: ci

# The premise of this repository is that the device refuses to run unless code,
# specs, and tests all agree. That is only true if CI actually checks it. Every
# job here is also a `make` target, so what CI runs and what a contributor runs
# locally cannot diverge.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No package runs arbitrary code at install time, in CI as on a workstation.
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  # Note: SOURCE_DATE_EPOCH is deliberately NOT set. It is honored by nothing in
  # the Node toolchain (not tsc, not npm, not node), so setting it here would be
  # a build variable that looks load-bearing and does nothing. It becomes
  # relevant when the Debian image build lands, where it genuinely applies.

jobs:
  # ---------------------------------------------------------------------------
  # The signer. This is the tier that holds keys and it gets checked hardest.
  # ---------------------------------------------------------------------------
  signer:
    name: signer holds together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, never install. A lockfile that resolves differently in CI than on a
      # workstation would make the published root hash unreproducible.
      - run: npm ci

      - name: Types
        run: make type-check

      # Includes the custom no-network rule enforcing INV-NET-2. A `fetch` call
      # or a `node:net` import anywhere under packages/ fails the build here.
      - name: Lint, including the no-network rule
        run: make lint

      - name: Build
        run: make build

      - name: Unit and property tests
        run: make test

      # The specification system: coverage, invariant binding, vectors,
      # differential, integrity, report. See docs/VERIFICATION.md section 3.
      - name: Specs, invariants and integrity
        run: make verify

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Correctness against the outside world, rather than against ourselves.
  # ---------------------------------------------------------------------------
  vectors:
    name: official BIP vectors and differential agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make build

      # BIP-32, BIP-39 (every bundled wordlist), BIP-84/86 addresses, BIP-174
      # PSBTs, BIP-340 Schnorr, BIP-322, BIP-380 descriptor checksums.
      # BIP-32, BIP-39, BIP-84/86 addresses and BIP-380 checksums, all vendored
      # and pinned by hash in the spec files so a vector cannot be edited to
      # make a failing implementation pass.
      - name: Official BIP test vectors
        run: make test-vectors

      # bitcoinjs-lib is an independent implementation written by different
      # people from the same specifications. Agreement is evidence; a
      # disagreement is a defect in one of them and we do not get to guess which.
      - name: Differential agreement with bitcoinjs-lib
        run: make test-differential

  # ---------------------------------------------------------------------------
  # Supply chain and reproducibility. The manifest root hash is worthless if a
  # third party cannot arrive at the same number.
  # ---------------------------------------------------------------------------
  supply-chain:
    name: build is reproducible and the manifest is honest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Regenerating the manifest must reproduce exactly what is committed. A
      # drift here means the published root hash describes a tree that no longer
      # exists.
      - name: MANIFEST.lock matches the tracked sources
        run: make manifest-check

      # Two clean builds, diffed. This catches an embedded timestamp or a
      # filesystem-ordering dependency at the commit that introduced it rather
      # than at the release.
      - name: Two builds produce identical output
        run: make repro-check

      # npm's own SBOM, normalised: npm stamps a random serialNumber and a
      # timestamp into every run, so two SBOMs of an identical tree would differ
      # in ways that mean nothing. A published SBOM's diff has to be signal.
      - name: SBOM
        run: make sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The no-lock-in promise. If this fails, funds are at risk of being
  # unrecoverable, which is worse than any other failure mode in this repo.
  # ---------------------------------------------------------------------------
  recovery-drill:
    name: every wallet recovers in Bitcoin Core alone
    runs-on: ubuntu-latest
    # Enabled once phase 2 lands wallet types to drill. Until then there is
    # nothing to recover, and a job that vacuously passes is worse than no job.
    if: false
    services:
      bitcoind:
        image: ruimarinho/bitcoin-core:latest
        options: >-
          --entrypoint bitcoind
        ports:
          - 18443:18443
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make build

      # For every supported wallet type: create in nullroute, export the
      # descriptor, import into a regtest Core, assert identical addresses and
      # balance, and spend. No nullroute code in the recovery path.
      - name: Recovery drill (INV-INTEROP-1)
        run: make test-recovery-drill

  # ---------------------------------------------------------------------------
  # Prose. The documentation is a deliverable, and overclaiming in it is a
  # security bug in a project whose value rests on honest boundaries.
  # ---------------------------------------------------------------------------
  prose:
    name: documentation style holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: No em dashes, no emoji, no unmarked claims
        run: make prose

      # Anchors, not just paths. A threat model that sends a reader to a section
      # of the verification procedure has to land on that section, or the reader
      # concludes the procedure does not exist.
      - name: Internal links and anchors resolve
        run: make links

      # A hardening profile states what must be true of the BUILT ARTIFACT, and
      # every assertion carries a verifier that inspects the artifact rather
      # than the recipe. This enforces that inversion: no assertion without a
      # verifier, no assertion without a stated limit, and no assertion claiming
      # to check at build time a fact only a running device can answer.
      - name: Hardening profiles are falsifiable
        run: make profiles

  # ---------------------------------------------------------------------------
  # nullroute.diy. Never ships to the device and never enters MANIFEST.lock,
  # so it is checked separately and cannot affect the signer's root hash.
  # ---------------------------------------------------------------------------
  web:
    name: website builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make web-lint
      - run: make web-type-check
      - run: make web-build

      # The site documents a device whose premise is that it has no network
      # capability. A docs site pulling a font from a CDN would undercut its own
      # argument on the page where it makes it.
      - name: Site loads nothing off-origin
        run: make web-isolation

      # Next inlines an RSC bootstrap into every page, so the CSP carries their
      # sha256 hashes. If they drift, the deployed policy blocks the scripts and
      # the site fails to hydrate while still looking fine to a crawler.
      - name: CSP hashes match the build
        run: make web-csp

      # Drives a real browser and measures the real layout. A flex item does not
      # shrink below its content, so one wide element can push every page
      # sideways while the build, the types and the tests all stay green.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: No page scrolls sideways on a phone
        run: make web-responsive
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
