name: ci

# The premise of this repository is that the device refuses to run unless code,
# specs, and tests all agree. That is only true if CI actually checks it. Every
# job here is also a `make` target, so what CI runs and what a contributor runs
# locally cannot diverge.
#
# That was half true for the life of the project. This direction held; the other
# one did not, and nothing checked either, so the two comments read as though
# they covered each other. Eighteen targets in `make check` were absent here,
# among them the threat-model honesty gate, the frontend CSP that is INV-NET-3,
# and every visual guarantee about the 800x480 panel. `make ci-parity` asserts
# it now, and it runs in this file.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No package runs arbitrary code at install time, in CI as on a workstation.
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  # Note: SOURCE_DATE_EPOCH is deliberately NOT set. It is honored by nothing in
  # the Node toolchain (not tsc, not npm, not node), so setting it here would be
  # a build variable that looks load-bearing and does nothing. The Debian image
  # build does honor it, and the `image` job below still does not read it from
  # here: the Makefile derives it from the commit being built, so two builds of
  # one commit agree whether they run in CI or on a workstation. Setting it in
  # this block would let the two disagree.

jobs:
  # ---------------------------------------------------------------------------
  # The signer. This is the tier that holds keys and it gets checked hardest.
  # ---------------------------------------------------------------------------
  signer:
    name: signer holds together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, never install. A lockfile that resolves differently in CI than on a
      # workstation would make the published root hash unreproducible.
      - run: npm ci

      - name: Types
        run: make type-check

      # Includes the custom no-network rule enforcing INV-NET-2. A `fetch` call
      # or a `node:net` import anywhere under packages/ fails the build here.
      - name: Lint, including the no-network rule
        run: make lint

      # Formatting is a check rather than a suggestion here: .prettierrc had
      # been in the repository from the start and nothing ran it, so 142 files
      # disagreed with the configuration the project declares.
      - name: Formatting
        run: make format-check

      # This file and `make check` ask for the same things. Its first finding
      # was itself, which is the right first finding for a parity check.
      - name: CI runs what make check runs
        run: make ci-parity

      - name: Build
        run: make build

      - name: Unit and property tests
        run: make test

      # The static checks on the interface and the documents. None of these
      # needs a browser, and every one of them was in `make check` and absent
      # from this file: an nr- class with no rule, a screen that traps the
      # user, a header offering an exit it says it withholds, a document
      # nobody can reach, an invariant claimed in the threat model with
      # nothing behind it, a Makefile naming a script that is gone, an IPC
      # method no screen calls, a frontend CSP that is not default-src 'none',
      # a QR payload with no stated failure mode, and a manifest recipe whose
      # transcript no longer matches what the commands print.
      - name: Interface and document checks
        run: |
          make ui-classes
          make ui-constants
          make no-dead-ends
          make header-rule
          make docs-reachable
          make invariant-claims
          make make-targets
          make ipc-reachable
          make slow-feedback
          make typeable
          make device-csp
          make qr-readback
          make manifest-recipe

      # The specification system: coverage, invariant binding, vectors,
      # differential, integrity, report. See docs/VERIFICATION.md section 3.
      - name: Specs, invariants and integrity
        run: make verify

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The panel itself. These drive a real browser at 800x480 and were the
  # largest gap between `make check` and this file: every visual guarantee this
  # project makes was enforced on a workstation and nowhere else.
  # ---------------------------------------------------------------------------
  interface:
    name: every screen fits the panel it ships on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      # Each of these builds what it measures, declared in the Makefile rather
      # than assumed from an earlier step: check-journeys once drove a stale
      # dist-app for exactly that reason.
      - name: Screens fit 800x480, and every marked statement is drawn
        run: make screen-fit
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Text meets WCAG AA in both themes
        run: make contrast
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Guidance is an Info everywhere
        run: make ui-roles
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      # Against a real daemon. This is the check that would have caught the
      # device shipping unable to create a wallet.
      - name: Guided journeys complete
        run: make journeys

      # The committed screenshots on nullroute.diy are the real frontend. If it
      # is redesigned and they are not regenerated, the site shows a device that
      # no longer exists.
      - name: The site's device screenshots match the frontend
        run: make device-shots-check
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: The frontend mounts under its own CSP
        run: make device-ui
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: The dev server serves a styled application
        run: make dev-check
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  # ---------------------------------------------------------------------------
  # Correctness against the outside world, rather than against ourselves.
  # ---------------------------------------------------------------------------
  vectors:
    name: official BIP vectors and differential agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make build

      # BIP-32, BIP-39 (every bundled wordlist), BIP-84/86 addresses, BIP-174
      # PSBTs, BIP-340 Schnorr, BIP-322, BIP-380 descriptor checksums.
      # BIP-32, BIP-39, BIP-84/86 addresses and BIP-380 checksums, all vendored
      # and pinned by hash in the spec files so a vector cannot be edited to
      # make a failing implementation pass.
      - name: Official BIP test vectors
        run: make test-vectors

      # bitcoinjs-lib is an independent implementation written by different
      # people from the same specifications. Agreement is evidence; a
      # disagreement is a defect in one of them and we do not get to guess which.
      - name: Differential agreement with bitcoinjs-lib
        run: make test-differential

  # ---------------------------------------------------------------------------
  # Supply chain and reproducibility. The manifest root hash is worthless if a
  # third party cannot arrive at the same number.
  # ---------------------------------------------------------------------------
  supply-chain:
    name: build is reproducible and the manifest is honest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Regenerating the manifest must reproduce exactly what is committed. A
      # drift here means the published root hash describes a tree that no longer
      # exists.
      - name: MANIFEST.lock matches the tracked sources
        run: make manifest-check

      # Two clean builds, diffed. This catches an embedded timestamp or a
      # filesystem-ordering dependency at the commit that introduced it rather
      # than at the release.
      - name: Two builds produce identical output
        run: make repro-check

      # npm's own SBOM, normalised: npm stamps a random serialNumber and a
      # timestamp into every run, so two SBOMs of an identical tree would differ
      # in ways that mean nothing. A published SBOM's diff has to be signal.
      - name: SBOM
        run: make sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The no-lock-in promise. If this fails, funds are at risk of being
  # unrecoverable, which is worse than any other failure mode in this repo.
  # ---------------------------------------------------------------------------
  recovery-drill:
    name: every wallet recovers in Bitcoin Core alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make build

      # Core comes from bitcoincore.org, pinned by version and checksum, rather
      # than from a third-party image. The whole point of this job is that
      # recovery does not depend on trusting us, and it would be an odd way to
      # make that argument while pulling the recovery tool from an unpinned
      # container someone else maintains.
      #
      # The hash is pinned here rather than fetched alongside the tarball,
      # because a checksum downloaded from the same host at the same moment
      # only proves the download was not corrupted in transit. Pinned, it is a
      # reviewable constant that changes visibly in a diff. Re-check it with:
      #   curl -s https://bitcoincore.org/bin/bitcoin-core-28.0/SHA256SUMS \
      #     | grep x86_64-linux-gnu.tar.gz
      # Verified against that file on 2026-08-15.
      #
      # The drill was written against this version and failed the first time
      # anybody ran it against Core 31, in three separate ways: a watch-only
      # wallet with only an inactive external descriptor cannot generate a
      # change address, Core reaches for a bech32 change address unless told the
      # descriptor's type, and taproot derivations live under a different PSBT
      # field. All three were the drill being wrong rather than Core changing
      # its mind about anything that matters, and all three are fixed. Worth
      # remembering that pinning a version buys reproducibility and hides drift.
      - name: Fetch Bitcoin Core
        env:
          CORE_VERSION: '28.0'
          CORE_SHA256: '7fe294b02b25b51acb8e8e0a0eb5af6bbafa7cd0c5b0e5fcbb61263104a82fbc'
        run: |
          set -euo pipefail
          FILE="bitcoin-${CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          curl -fsSLO "https://bitcoincore.org/bin/bitcoin-core-${CORE_VERSION}/${FILE}"
          echo "${CORE_SHA256}  ${FILE}" | sha256sum -c -
          tar -xzf "${FILE}"
          echo "$PWD/bitcoin-${CORE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Start regtest
        run: |
          set -euo pipefail
          bitcoind -regtest -daemon -fallbackfee=0.0002 \
            -rpcuser=nullroute -rpcpassword=drill -rpcport=18443 -rpcbind=127.0.0.1 \
            -rpcallowip=127.0.0.1
          for _ in $(seq 1 60); do
            if bitcoin-cli -regtest -rpcuser=nullroute -rpcpassword=drill \
              -rpcport=18443 getblockchaininfo >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "bitcoind did not become ready" >&2
          exit 1

      # For every supported wallet type: create in nullroute, export the
      # descriptor, import into a regtest Core, assert identical addresses and
      # balance, and spend. No nullroute code in the recovery path.
      - name: Recovery drill (INV-INTEROP-1)
        run: make test-recovery-drill

  # ---------------------------------------------------------------------------
  # Prose. The documentation is a deliverable, and overclaiming in it is a
  # security bug in a project whose value rests on honest boundaries.
  # ---------------------------------------------------------------------------
  prose:
    name: documentation style holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: No em dashes, no emoji, no unmarked claims
        run: make prose

      # Anchors, not just paths. A threat model that sends a reader to a section
      # of the verification procedure has to land on that section, or the reader
      # concludes the procedure does not exist.
      - name: Internal links and anchors resolve
        run: make links

      # A hardening profile states what must be true of the BUILT ARTIFACT, and
      # every assertion carries a verifier that inspects the artifact rather
      # than the recipe. This enforces that inversion: no assertion without a
      # verifier, no assertion without a stated limit, and no assertion claiming
      # to check at build time a fact only a running device can answer.
      - name: Hardening profiles are falsifiable
        run: make profiles

  # ---------------------------------------------------------------------------
  # The image. Builds a real rootfs and lets the unchanged verifiers judge it.
  #
  # This job exists because two assertions had never been checked by anything.
  # INV-PROV-18 and INV-PROV-19 name systemd-analyze exposure thresholds for the
  # two units, and systemd-analyze is a Linux tool while much of this project is
  # written on macOS. `make verify-image` there reports could-not-run and exits
  # zero, correctly, which means the local answer had been "not checked" for as
  # long as the assertions existed. The units were measured by hand once. A hand
  # measurement is evidence and not verification.
  # ---------------------------------------------------------------------------
  image:
    name: the built artifact satisfies its profile
    runs-on: ubuntu-latest
    # mmdebstrap under emulation. Generous rather than tuned: a timeout that
    # trips on a slow mirror teaches people to re-run jobs without reading them.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # arm64 on purpose: the target is a Raspberry Pi 5, and cross-building a
      # rootfs is a different exercise with different failure modes. The runner
      # is x86_64, so the arm64 container needs binfmt.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # NULLROUTE_EXPORT_ROOTFS gives the file-reading verifiers a tree to read.
      # Without it there is only an erofs blob, and every rootfs assertion
      # reports could-not-run.
      - name: Build the system partition
        run: NULLROUTE_EXPORT_ROOTFS=1 make image-system

      # REQUIRE is what makes this job mean something. Without it the command
      # goes green on a runner missing a tool, having verified nothing and
      # printed a reassuring summary, which is the exact false pass the
      # provisioning directory argues against. Naming the two assertions this
      # job exists for turns a missing tool into a failure.
      #
      # Only those two. The others are satisfied here as a side effect and
      # requiring them would make this job fail for reasons it is not about.
      - name: The artifact satisfies its profile
        run: |
          make verify-image \
            ROOT=out/system/rootfs \
            IMAGE=out/system/nullroute.img \
            REQUIRE=INV-PROV-18,INV-PROV-19

  # ---------------------------------------------------------------------------
  # nullroute.diy. Never ships to the device and never enters MANIFEST.lock,
  # so it is checked separately and cannot affect the signer's root hash.
  # ---------------------------------------------------------------------------
  web:
    name: website builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make web-lint
      - run: make web-type-check
      - run: make web-build

      # The site documents a device whose premise is that it has no network
      # capability. A docs site pulling a font from a CDN would undercut its own
      # argument on the page where it makes it.
      - name: Site loads nothing off-origin
        run: make web-isolation

      # Next inlines an RSC bootstrap into every page, so the CSP carries their
      # sha256 hashes. If they drift, the deployed policy blocks the scripts and
      # the site fails to hydrate while still looking fine to a crawler.
      - name: CSP hashes match the build
        run: make web-csp

      # Drives a real browser and measures the real layout. A flex item does not
      # shrink below its content, so one wide element can push every page
      # sideways while the build, the types and the tests all stay green.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: No page scrolls sideways, phone to desktop
        run: make web-responsive
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      # Reads the built HTML rather than the markdown behind it. `make links`
      # checks the repository, where ../README.md is a real file; the site
      # rewrites that into a route, and three of those routes did not exist.
      - name: Every link on the built site resolves
        run: make web-site-links

      # The one falsifiable object on the site. It hands a reader a printf
      # command and promises their terminal prints the same digest, and it has
      # been wrong before: the command elided the roll string after 24
      # characters, so it hashed different bytes than the page displayed.
      - name: The dice demo agrees with docs/ENTROPY.md
        run: make web-dice-demo
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
