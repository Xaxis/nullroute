id: core.descriptor.parse
version: 1
title: BIP-380 output descriptor parsing
assurance_tier: critical
status: implemented

purpose: >
  Turn a descriptor string into a structure the device can reason about. Every
  script-ownership decision rests on this: an output is labelled change only if
  it re-derives from a registered descriptor, and an input is signable only if
  its script matches one. A parser that guesses eventually labels an attacker's
  address as change.

covers:
  - packages/core/src/descriptor/parse.ts::parseDescriptor
  - packages/core/src/descriptor/parse.ts::parseKeyExpression
  - packages/core/src/descriptor/parse.ts::descriptorKeys
  - packages/core/src/descriptor/parse.ts::canonicalKeyExpression
  - packages/core/src/descriptor/parse.ts::DescriptorParseError

algorithm: >
  Recursive descent over the BIP-380 grammar. A descriptor is a function call;
  arguments are split at the top level only, tracking parenthesis and bracket
  depth so that nesting and key origins do not confuse the split.

  A key expression is an optional [fingerprint/path] origin followed by either a
  raw hex key of 32, 33 or 65 bytes, or an extended public key with an optional
  derivation suffix. An extended key must pass its base58check and be what
  BIP-32 calls a valid extended public key: a public version this parser
  reads, a compressed point on the curve, and no parent fingerprint or child
  index at depth zero. Both hardened notations BIP-380 allows, h and ', are
  accepted and normalised to the apostrophe form; H, which BIP-380 lists as
  invalid, is refused. A trailing /* marks a range; BIP-389 /<a;b> multipath is
  recorded as alternatives, and read only as the last step before the
  wildcard. Anywhere else it is refused, because derivation substitutes the
  chosen branch into the final step.

  The checksum is verified as part of parsing rather than left to the caller,
  and is required unless allowBadChecksum is explicitly passed.

  Anything not understood exactly is refused. There is no lenient mode and no
  partial parse.

invariants:
  - id: INV-DPARSE-1
    statement: >
      Every key expression BIP-380 publishes as valid that holds no private key
      and no hardened wildcard, ten of twenty one, parses to the key, origin,
      derivation and range it names. The extraction of those vectors from the
      BIP text is checked by every extended key in it passing its own
      base58check.
    tests:
      - packages/core/test/descriptor.parse.test.ts::accepts-bip380-key-expressions
      - packages/core/test/vectors.bip380.test.ts::extraction-is-faithful
      - packages/core/test/vectors.bip380.test.ts::parses-every-published-valid-public-key-expression

  - id: INV-DPARSE-2
    statement: >
      Both hardened notations normalise, so a descriptor from Bitcoin Core
      parses identically to one written per BIP-32.
    tests:
      - packages/core/test/descriptor.parse.test.ts::normalizes-hardened-notation-in-origins

  - id: INV-DPARSE-3
    statement: >
      Malformed origins, unknown key formats, hardened wildcards, H as a
      hardened marker and malformed multipath are refused rather than
      interpreted, and a key that starts like an extended key is checked
      against its own base58check and against BIP-32's rules for an extended
      public key rather than being accepted on the strength of its first four
      characters. Every key expression BIP-380 publishes as invalid, all
      sixteen, is refused, and so is every key in BIP-32 test vector 5, all
      sixteen, through each path a key from outside takes: a key expression,
      a descriptor, a coordinator file, an assembled quorum and the canonical
      rewrite.
    tests:
      - packages/core/test/descriptor.parse.test.ts::refuses-what-it-does-not-understand
      - packages/core/test/descriptor.parse.test.ts::refuses-multipath-anywhere-but-the-last-step
      - packages/core/test/descriptor.parse.test.ts::refuses-malformed-or-unknown-scripts
      - packages/core/test/descriptor.parse.test.ts::refuses-a-key-that-only-starts-like-an-extended-key
      - packages/core/test/vectors.bip380.test.ts::refuses-every-published-invalid-key-expression
      - packages/core/test/vectors.bip380.test.ts::refuses-the-published-forms-it-declines-by-design
      - packages/core/test/vectors.bip32.test.ts::every-import-path-refuses-every-published-invalid-extended-key

  - id: INV-DPARSE-4
    statement: >
      A descriptor containing an extended private key or a WIF private key is
      refused, including the nine valid BIP-380 key expressions that hold one.
    tests:
      - packages/core/test/descriptor.parse.test.ts::refuses-extended-private-keys
      - packages/core/test/vectors.bip380.test.ts::refuses-the-published-forms-it-declines-by-design

  - id: INV-DPARSE-5
    statement: >
      The checksum is enforced at the parse boundary, not left to a caller who
      might forget.
    tests:
      - packages/core/test/descriptor.parse.test.ts::enforces-the-checksum

  - id: INV-DPARSE-6
    statement: >
      Arguments are split at the top level only, so nested scripts parse
      correctly.
    tests:
      - packages/core/test/descriptor.parse.test.ts::splits-arguments-at-the-top-level-only
      - packages/core/test/descriptor.parse.test.ts::parses-nested-scripts

  # The statement here read "not evaluable until phase 3", which stopped being
  # true when the evaluators were written. wsh(sortedmulti(...)) derives
  # addresses today (deriveMultisigAddresses) and so does tr() with a script
  # tree (deriveTaprootAddresses, which builds the tree and preserves its
  # shape). A spec describing the code as less capable than it is drifts the
  # same way as one describing it as more capable: both mean a reader cannot
  # use it to decide anything.
  - id: INV-DPARSE-7
    statement: >
      Multisig and taproot forms parse into the same tree as the single
      signature ones, so an evaluator consumes one shape rather than each form
      reshaping the parse.
    tests:
      - packages/core/test/descriptor.parse.test.ts::parses-multisig-into-the-tree
      - packages/core/test/descriptor.parse.test.ts::parses-the-single-sig-forms

  - id: INV-DPARSE-8
    statement: >
      A key expression has one written form. The spellings BIP-380 treats as
      equal (a hardened step as ' or h, and a fingerprint in any case) are
      written back out identically, a key spelled with H is refused rather
      than rewritten, and a rewrite that would change what the key means
      throws rather than being emitted.
    tests:
      - packages/core/test/descriptor.parse.test.ts::writes-one-spelling-for-every-legal-form-of-the-same-key
      - packages/core/test/descriptor.parse.test.ts::leaves-a-key-it-cannot-improve-exactly-as-it-was
      - packages/core/test/descriptor.parse.test.ts::canonicalises-only-what-parses-back-to-the-same-key
      - packages/core/test/descriptor.assemble.test.ts::writes-one-checksum-however-the-keys-were-spelled

  - id: INV-DPARSE-9
    statement: >
      A key's canonical form writes its extended key under the network's
      standard BIP-32 prefix, xpub or tpub, whichever SLIP-132 prefix it was
      given in, so an assembled quorum has one descriptor and one checksum
      however its keys were spelled, and one Bitcoin Core will import.
    tests:
      - packages/core/test/descriptor.assemble.test.ts::writes-one-checksum-whichever-slip132-prefix-a-key-was-given-in

vectors:
  - name: BIP-380 key expression test vectors, extracted from the BIP text
    file: spec/vectors/bip380-key-expressions.json
    sha256: be33d8abe86eea69cee43b36462c221c3d0ccdb97d99579572403b0e9ed1c010
    source: https://github.com/bitcoin/bips/blob/93607da01df07348dcd37ddf62d3cae350436783/bip-0380.mediawiki
  - name: BIP-32 test vector 5, the invalid extended keys, extracted from the BIP text
    file: spec/vectors/bip32-invalid-keys.json
    sha256: ef725eb0503be0eb9037d605b6d50dec86966bb22261758797aac9a44290807c
    source: https://github.com/bitcoin/bips/blob/c0644a054fd1568ecbfc9c2b656ad5200b16ff74/bip-0032.mediawiki

threats:
  - INV-PSBT-1
  - INV-PSBT-2
  - INV-INTEROP-1

security_notes: >
  Parsing is not evaluation. This module produces a structure and derives
  nothing; what a form means is decided by the evaluator that consumes it,
  which refuses a shape it does not handle rather than treating it as something
  simpler. This paragraph used to say multisig and taproot script paths were
  not derived and that a tr() with a script tree was refused outright. Both
  stopped being true when multisig.ts and taproot.ts were written, and taproot
  in particular now builds the tree and preserves its shape precisely because
  the merkle root tweaks the output key: deriving the key-path address while
  ignoring the tree is the failure that paragraph was warning about, and it is
  the one the evaluator exists to prevent.

  A valid parse says nothing about provenance. Anyone can write a well-formed
  descriptor, including one describing someone else's keys. Establishing that a
  descriptor is the one your cosigner sent is what out-of-band checksum
  comparison is for.

  WIF private keys are not accepted at all, and an extended private key is
  refused with an explicit message rather than parsed and ignored.

  THE PARSER DOES NOT CHECK CONTEXT. Where a script may appear (sh() only at
  the top, wpkh() and wsh() only at the top or inside sh(), tr(), combo(),
  raw() and addr() only at the top) and which keys a context allows
  (compressed only under wpkh() and wsh(), no uncompressed key under tr()) are
  left to the evaluator that consumes the tree, which refuses anything it does
  not derive. Of the thirty two invalid descriptors BIPs 381 to 386 publish,
  eighteen parse and are refused there, each listed in its vector test
  (INV-DESC-10). That holds only while every path from a descriptor to an
  address goes through deriveQuorumAddresses or the functions it dispatches
  to. The 'descriptor.parse' IPC method reports such a descriptor as parsed.

  H AS A HARDENED MARKER WAS ACCEPTED until the BIP-380 vectors were run. The
  BIP has listed it as invalid since bitcoin/bips 3cc71d7c (July 2025), and
  Bitcoin Core never accepted it, so this parser read descriptors no
  coordinator following either would import. The derivation path parser
  outside descriptors still reads H.

references:
  - BIP-32, Hierarchical Deterministic Wallets, test vector 5
  - BIP-380, Output Script Descriptors General Operation
  - BIP-381, Non-Segwit Output Script Descriptors
  - BIP-382, Segwit Output Script Descriptors
  - BIP-386, tr() Output Script Descriptors
  - BIP-389, Multipath Descriptor Key Expressions
