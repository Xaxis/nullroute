  - INV-PSBT-2

security_notes: >
  THIS EXISTS BECAUSE THE BRANCH WAS WRITTEN FOUR TIMES AND FORGOTTEN TWICE.
  The owned index and the registration smoke test dispatched on script kind.
  The two IPC methods that show a user a quorum address did not: they called
  the multisig function unconditionally and refused taproot.

  The result was a taproot quorum that could be registered, signed for and
  recognised as change, and never once displayed. The receive screen's quorum
  tab errored and so did the screen for comparing addresses between devices.
  Neither derivation was wrong. What was wrong was a rule everybody had to
  remember being remembered in three places out of five.

  A CALL SITE CANNOT FORGET NOW, because dispatching is the only thing on
  offer. That is the whole security argument for this module: it removes an
  opportunity to be inconsistent rather than adding a check that catches it
  afterwards.

  THE TWO KINDS MUST DERIVE DIFFERENT ADDRESSES, which is asserted rather than
  assumed. If they agreed, every other test here would pass while the dispatch
  did nothing at all, and the module would be decorative.

  THE PUBLISHED VECTORS MOSTLY EXERCISE REFUSALS. Of fifty eight valid
  descriptors in BIPs 381 to 387, five are kinds this device derives, and
  the rest hold a private key or are kinds it does not derive at all. For
  those, INV-DESC-9 checks the parse and the key derivation against the
  published scripts, using script templates the test supplies, and says so:
  it is not evidence of a single-key, combo(), raw() or addr() evaluator,
  because the device has none. Twenty two of the thirty nine invalid
  descriptors reach this function at all only because the parser leaves
  placement and key-context rules to the evaluator (see
  core.descriptor.parse). Two of those rules were not enforced here either
  until the vectors were run: tr() over an uncompressed key derived an
  address (INV-TR-7), and so did wsh(multi()) over one (INV-MULTI-14).
  BIP-387's vectors, run later, found nothing new.

references:
  - BIP-380, Output Script Descriptors
  - BIP-381 to BIP-387, the descriptor documents whose vectors INV-DESC-9 and INV-DESC-10 run
  - BIP-387, Tapscript Multisig Output Script Descriptors
