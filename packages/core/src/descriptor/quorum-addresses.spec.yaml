id: core.descriptor.quorum-addresses
version: 1
title: One place that dispatches on a quorum's script kind
assurance_tier: critical
status: implemented

purpose: >
  Derive the addresses a registered quorum pays to, whichever kind of descriptor
  it is, from a single function. Taproot quorums and the older kinds derive
  through different code, and every caller having to remember that is how one
  of them stopped.

covers:
  - packages/core/src/descriptor/quorum-addresses.ts::deriveQuorumAddresses

algorithm: >
  A tr() descriptor derives through the taproot path; everything else through
  the multisig path. A descriptor that is not a quorum at all is refused by
  whichever underlying function was reached, because both already say what they
  expected and what they got.

  The returned shape is the common part of the two: the address and its index
  within the branch. The extra fields each side carries, the derived public keys
  in script order for multisig and whether a script path exists for taproot, are
  real and belong to their own kinds, so they are not merged into a union a
  caller would have to narrow.

invariants:
  - id: INV-DESC-8
    statement: >
      Dispatch produces exactly what the matching derivation function produces,
      for both kinds and on both branches, and the two kinds derive genuinely
      different addresses so the dispatch cannot be doing nothing.
    tests:
      - packages/core/test/descriptor.quorum-addresses.test.ts::agrees-with-the-multisig-function-for-a-wsh-quorum
      - packages/core/test/descriptor.quorum-addresses.test.ts::agrees-with-the-taproot-function-for-a-taproot-quorum
      - packages/core/test/descriptor.quorum-addresses.test.ts::derives-genuinely-different-addresses-for-the-two-kinds
      - packages/core/test/descriptor.quorum-addresses.test.ts::derives-the-change-branch-for-both-kinds
      - packages/core/test/descriptor.quorum-addresses.test.ts::refuses-a-single-signature-descriptor-through-the-underlying-error

  # This function is the one place the device turns a descriptor into
  # addresses, which is why the published descriptor vectors are bound here.
  - id: INV-DESC-9
    statement: >
      Every valid descriptor BIPs 381 to 387 publish is handled as its test
      lists it, case by case. Five derive their published scriptPubKey through
      this function: sh(wsh(multi())) over sixteen keys from BIP-383, tr(KEY)
      and tr(KEY,pk(KEY)) from BIP-386, and tr(KEY,multi_a()) over fixed keys
      and tr(KEY,sortedmulti_a()) over ranged ones, at children 0 to 2, from
      BIP-387. Twenty three are kinds this function refuses (single-key pk(),
      pkh() and wpkh() in any nesting, bare multi() and sortedmulti(),
      combo(), raw() and addr()); each still parses, and the scripts the test
      rebuilds from its parse tree, with keys derived by derivePubkeyAt, equal
      the published ones at every listed index. The other thirty carry a WIF
      or extended private key and are refused by the parser (INV-DPARSE-4).
      BIP-387's multi_a() and sortedmulti_a() over the same two xprvs, run
      with each xprv replaced by its public half, derive their published
      scripts too.
    tests:
      - packages/core/test/vectors.bip381.test.ts::extraction-is-faithful
      - packages/core/test/vectors.bip381.test.ts::handles-every-published-valid-descriptor
      - packages/core/test/vectors.bip382.test.ts::extraction-is-faithful
      - packages/core/test/vectors.bip382.test.ts::handles-every-published-valid-descriptor
      - packages/core/test/vectors.bip383.test.ts::extraction-is-faithful
      - packages/core/test/vectors.bip383.test.ts::handles-every-published-valid-descriptor
      - packages/core/test/vectors.bip384.test.ts::extraction-is-faithful
      - packages/core/test/vectors.bip384.test.ts::handles-every-published-valid-descriptor
      - packages/core/test/vectors.bip385.test.ts::extraction-is-faithful
      - packages/core/test/vectors.bip385.test.ts::handles-every-published-valid-descriptor
      - packages/core/test/vectors.bip386.test.ts::extraction-is-faithful
      - packages/core/test/vectors.bip386.test.ts::handles-every-published-valid-descriptor
      - packages/core/test/vectors.bip387.test.ts::extraction-is-faithful
      - packages/core/test/vectors.bip387.test.ts::handles-every-published-valid-descriptor

  - id: INV-DESC-10
    statement: >
      Every invalid descriptor BIPs 381 to 387 publish is refused before any
      address is derived from it, at the stage its test lists. Seventeen are
      refused by parseDescriptor. Twenty two parse, because the parser does
      not check where a script may appear or which keys a context allows, and
      are refused by this function: a misplaced sh(), wsh(), wpkh(), tr(),
      combo(), raw() or addr(), multi_a() at the top level or under sh() or
      wsh(), addr() of a string that is not an address, an uncompressed key
      under wpkh(), wsh(), tr() or a multi_a() leaf, and a bare sh(multi()) of
      sixteen keys.
    tests:
      - packages/core/test/vectors.bip381.test.ts::refuses-every-published-invalid-descriptor
      - packages/core/test/vectors.bip382.test.ts::refuses-every-published-invalid-descriptor
      - packages/core/test/vectors.bip383.test.ts::refuses-every-published-invalid-descriptor
      - packages/core/test/vectors.bip384.test.ts::refuses-every-published-invalid-descriptor
      - packages/core/test/vectors.bip385.test.ts::refuses-every-published-invalid-descriptor
      - packages/core/test/vectors.bip386.test.ts::refuses-every-published-invalid-descriptor
      - packages/core/test/vectors.bip387.test.ts::refuses-every-published-invalid-descriptor

