id: core.util.secret
version: 1
title: Zeroizing wrapper for key material
assurance_tier: critical
status: implemented

purpose: >
  Give secret bytes a distinct type so that zeroization is explicit and
  auditable, and so that a secret cannot reach a log line, an error message, or
  an IPC response by being interpolated into text. The problem is not that
  people forget to zeroize; it is that zeroization scattered across call sites
  is unauditable, and a raw Uint8Array of seed bytes looks exactly like a raw
  Uint8Array of an address.

covers:
  - packages/core/src/util/secret.ts::Secret
  - packages/core/src/util/secret.ts::SecretDisposedError

inputs:
  - name: bytes
    type: Uint8Array
    constraints: 'any length; ownership transfers to the Secret unless copyOf is used'

outputs:
  - name: secret
    type: Secret
    constraints: 'disposable; reads after disposal throw'

algorithm: >
  The buffer is held in a private field. dispose() overwrites it in place with
  zeros using the audited clean() helper from @noble/hashes, then drops the
  reference, and is idempotent so an explicit call and a `using` scope cannot
  double-free. Every read goes through a guard that throws SecretDisposedError
  if the buffer is gone.

  Every stringification path is overridden to return "[Secret <label>]":
  toString, toJSON, the Node inspect symbol, and Symbol.toStringTag. Equality is
  compared over the full buffer length rather than returning early at the first
  differing byte.

invariants:
  - id: INV-KEY-2
    statement: >
      dispose() zeroizes the underlying buffer in place, so a caller holding its
      own reference to the same memory sees zeros rather than the plaintext.
    tests:
      - packages/core/test/util.secret.test.ts::zeroizes-on-dispose
      - packages/core/test/util.secret.test.ts::disposes-on-scope-exit
      - packages/core/test/util.secret.test.ts::disposes-when-scope-throws

  - id: INV-KEY-3
    statement: >
      Reading a disposed secret throws rather than returning zeroized or reused
      memory.
    tests:
      - packages/core/test/util.secret.test.ts::use-after-dispose-throws

  - id: INV-KEY-4
    statement: >
      No stringification path exposes the bytes. toString, template
      interpolation, JSON.stringify (directly and nested in an object), and
      Object.prototype.toString all redact.
    tests:
      - packages/core/test/util.secret.test.ts::redacts-on-every-stringification-path

  - id: INV-KEY-5
    statement: >
      Equality comparison examines the full buffer rather than returning early at
      the first differing byte.
    tests:
      - packages/core/test/util.secret.test.ts::compares-in-constant-time-over-the-full-length

threats:
  - INV-KEY-1
  - INV-KEY-2

security_notes: >
  This class cannot stop V8 from having already copied the bytes. A Uint8Array
  can be relocated by the garbage collector between allocation and disposal,
  leaving a copy we hold no reference to and cannot clear. That is a real
  limitation of doing cryptography in a managed runtime, and the mitigation is
  at the system level rather than here: no swap and tmpfs for scratch
  (provisioning/HARDENING.md), and the seed disposed at lock and on the idle
  timeout (INV-IDLE-2). The daemon runs until power-off, so a short-lived
  process is not one of them.

  It is also not protection against an attacker who can read process memory
  while the process is live. If they can do that, the secret is in use and
  therefore in memory regardless.

  The constant-time comparison short-circuits on length. That is deliberate:
  buffer lengths here are public, so there is nothing to leak, and padding to a
  fixed size would buy nothing.

references:
  - docs/THREAT-MODEL.md, Data remanence
  - '@noble/hashes utils.clean'
