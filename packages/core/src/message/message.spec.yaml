id: core.message.bip322
version: 1
title: BIP-322 message commitment and review
assurance_tier: critical
status: implemented

purpose: >
  Commit to a message the way BIP-322 specifies, and put it in front of a human
  before anything signs it. A message signature is a proof that whoever holds
  the key agreed to a specific string, so the string is the thing that must be
  read.

covers:
  - packages/core/src/message/bip322.ts::taggedHash
  - packages/core/src/message/bip322.ts::messageHash
  - packages/core/src/message/bip322.ts::reviewMessage
  - packages/core/src/message/bip322.ts::assertSignable
  - packages/core/src/message/bip322.ts::MessageError
  - packages/core/src/message/bip322.ts::MAX_MESSAGE_LENGTH
  - packages/core/src/message/sign.ts::buildToSpend
  - packages/core/src/message/sign.ts::toSpendTxidForBuilder
  - packages/core/src/message/sign.ts::signMessage
  - packages/core/src/message/sign.ts::signMessageWithKey

algorithm: >
  The commitment is the BIP-340 style tagged hash under "BIP0322-signed-message":
  SHA256(SHA256(tag) || SHA256(tag) || message). The doubled tag hash is what
  makes a commitment under one tag unusable under another, so a message hash can
  never be mistaken for a transaction sighash.

  Review bounds the message, refuses anything that can render differently from
  the bytes it commits to, and warns about what is legitimate but easy to miss.
  assertSignable is the same check as a refusal, for callers on the signing path
  that must not be able to proceed by forgetting to read a list.

  THE SCOPE IS NARROW AND EVERY EXCLUSION IS REFUSED BY NAME. Implemented: the
  commitment, the review, to_spend, and simple-variant signing for p2wpkh and
  p2sh-p2wpkh. Not implemented: taproot, which needs the Schnorr path and a
  different witness; the full variant, for scripts that cannot be expressed as
  a witness; and legacy p2pkh, which BIP-322 allows to use the older
  signmessage scheme, a different construction with a different commitment.
  Each throws rather than producing something a verifier would reject.

  THE SIGNATURE IS PRODUCED FROM THE DIGEST DIRECTLY. @scure/btc-signer builds
  to_sign and computes the BIP-143 preimage; @noble/curves signs it. The
  library's own signing entry point was tried and produced a signature that
  verified against neither the digest it computes itself nor the one
  bitcoinjs-lib computes for the same transaction. Rather than ship something
  whose provenance could not be explained, the digest is taken from the library
  and signed directly, which is one fewer black box on the path that produces
  proofs.

invariants:
  - id: INV-MSG-1
    statement: >
      The message hash matches the values published in BIP-322, and commitments
      are separated by tag so one cannot be replayed as another.
    tests:
      - packages/core/test/message.test.ts::matches-the-published-message-hashes
      - packages/core/test/message.test.ts::separates-commitments-by-tag
      - packages/core/test/message.test.ts::is-deterministic

  - id: INV-MSG-2
    statement: >
      A message that could display differently from what would be signed is
      refused rather than repaired, while newlines and tabs are allowed and
      warned about.
    tests:
      - packages/core/test/message.test.ts::refuses-a-message-that-can-display-differently-from-what-is-signed
      - packages/core/test/message.test.ts::allows-newlines-and-tabs-and-warns-about-them

  - id: INV-MSG-3
    statement: >
      An empty message and one too long to read are both refused, on the review
      path and on the signing path.
    tests:
      - packages/core/test/message.test.ts::refuses-an-empty-message-and-one-too-long-to-read
      - packages/core/test/message.test.ts::refuses-on-the-signing-path-rather-than-returning-a-list-to-ignore

  - id: INV-MSG-4
    statement: >
      The review reports the exact commitment and the shape of the message, and
      warns about what is legitimate but invisible without blocking it.
    tests:
      - packages/core/test/message.test.ts::reports-the-commitment-and-the-shape-of-the-message
      - packages/core/test/message.test.ts::warns-about-what-is-easy-to-miss-without-blocking-it

  - id: INV-MSG-6
    statement: >
      A signature verifies against a BIP-143 digest computed by a different
      library for a transaction that library rebuilt, is deterministic, and
      carries the public key the address commits to.
    tests:
      - packages/core/test/message.sign.test.ts::produces-a-signature-that-verifies-against-an-independent-sighash
      - packages/core/test/message.sign.test.ts::signs-the-same-message-identically-every-time
      - packages/core/test/message.sign.test.ts::signs-wrapped-segwit-too
      - packages/core/test/message.sign.test.ts::signs-for-the-address-the-path-produces

  - id: INV-MSG-7
    statement: >
      A script type this device cannot sign simply is refused by name, and a
      message the review would refuse never reaches a signing path.
    tests:
      - packages/core/test/message.sign.test.ts::refuses-what-it-cannot-sign
      - packages/core/test/message.sign.test.ts::refuses-a-message-the-review-would-refuse

  - id: INV-MSG-5
    statement: >
      The to_spend transaction matches the txid BIP-322 publishes, commits to
      both the message and the address, and is deterministic.
    tests:
      - packages/core/test/message.sign.test.ts::matches-the-published-to_spend-txid
      - packages/core/test/message.sign.test.ts::builds-every-field-the-standard-fixes
      - packages/core/test/message.sign.test.ts::commits-to-the-message-in-the-transaction-itself
      - packages/core/test/message.sign.test.ts::commits-to-the-address-as-well-as-the-message
      - packages/core/test/message.sign.test.ts::is-deterministic

threats:
  - INV-SIG-1

security_notes: >
  THE TXID BYTE ORDER COST AN ENTIRE IMPLEMENTATION and is worth recording. A
  txid is hashed in one order and displayed in the other, and libraries
  disagree about which their API takes: @scure/btc-signer takes the displayed
  order and reverses on serialisation, bitcoinjs-lib takes the hashed order and
  writes it as-is. Passing the wrong one produced signatures that were
  deterministic, correctly shaped, for the right address, and committed to an
  outpoint that does not exist. Nothing about the output looked wrong, every
  self-consistent test passed, and it was caught only by serialising the same
  transaction with both libraries and diffing the bytes.

  That is why INV-MSG-6 verifies against a digest computed by the other library
  rather than against this one's own. A signature that only this device accepts
  proves nothing to the person who asked for it.

  THE ATTACK THIS MODULE IS SHAPED AROUND is a user induced to sign a string
  chosen by somebody else, where the string means something elsewhere. A
  signature is a proof of agreement, and agreement to text nobody read is not
  agreement. Hence the length bound, which is a reading limit rather than a
  protocol one, and the refusal of an empty message, which commits to nothing
  and whose meaning is supplied entirely by whoever asked for it.

  INV-MSG-2 IS THE SHARP EDGE. The signature commits to bytes and the user
  agrees to pixels. A bidi override reverses rendered order and zero-width
  characters render as nothing, so either lets a message read as one thing and
  commit to another. Those are refused rather than stripped: repairing one
  quietly would hide that somebody tried, on the one screen where being tricked
  is the entire risk.

  WHEN SIGNING LANDS IT MUST BE DETERMINISTIC, for the reason INV-SIG-1 exists.
  A randomised signature has room to leak the key a few bits at a time, and a
  message signature is the easiest thing in the world to ask somebody for
  repeatedly and at will.

references:
  - BIP-322, Generic Signed Message Format
  - BIP-340, Schnorr Signatures for secp256k1
  - docs/THREAT-MODEL.md
