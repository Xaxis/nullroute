id: daemon.ipc.socket
version: 1
title: Unix socket IPC and boot attestation
assurance_tier: critical
status: implemented

purpose: >
  Hold every impure operation the device performs: the socket, the filesystem,
  and eventually the hardware. packages/core stays pure so a reviewer can load
  it standalone and reproduce results; this package is where the impurity is
  concentrated so it can be audited in one place.

  It is also where two invariants are enforced rather than described: the
  process listens on a Unix domain socket and nothing else, and it refuses to
  start unless the build verified.

covers:
  - packages/daemon/src/ipc/socket.ts::startIpcServer
  - packages/daemon/src/ipc/socket.ts::assertNoNetworkListeners
  - packages/daemon/src/ipc/socket.ts::MAX_REQUEST_BYTES
  - packages/daemon/src/ipc/socket.ts::IpcError
  - packages/daemon/src/boot/attestation.ts::requirePassingVerification
  - packages/daemon/src/boot/attestation.ts::manifestRootHash
  - packages/daemon/src/boot/attestation.ts::readVerityRootHash
  - packages/daemon/src/boot/attestation.ts::abbreviateHash
  - packages/daemon/src/boot/attestation.ts::AttestationError
  - packages/daemon/src/handler.ts::createHandler

algorithm: >
  The server binds with listen({ path }), never listen({ port }). A Unix domain
  socket has no address family reaching off the machine, no port and no route;
  it lives in node:net only because that is where the API is. The socket file is
  chmod 0660 so only the daemon's group, which is the bridge, can connect.

  After binding, the process inspects its own active handles and throws if any
  reports an address carrying a port, which is what distinguishes a TCP or UDP
  listener from a Unix socket.

  Messages are newline-delimited JSON. A line is a complete message, so a
  truncated message cannot be read as a shorter valid one. Anything over
  MAX_REQUEST_BYTES destroys the connection before parsing.

  At startup the verification report must exist, must record passed, must
  contain no failed check, and must record a manifest root hash equal to
  SHA-256 of the MANIFEST.lock on disk. Any of the four failing aborts startup.

invariants:
  - id: INV-NET-1
    statement: >
      The process listens on a Unix domain socket and holds no listener on any
      network address family.
    tests:
      - packages/daemon/test/ipc.test.ts::holds-no-network-listener

  - id: INV-KEY-1
    statement: >
      No IPC response contains seed bytes, mnemonic entropy, the mnemonic, the
      passphrase, or an extended private key, on any method or any error path.
    tests:
      - packages/daemon/test/ipc.test.ts::never-returns-key-material

  - id: INV-KEY-6
    statement: >
      A passphrase changes the reported fingerprint, and both the presence and
      absence of one succeed, which is why the fingerprint is the only signal a
      user gets that they mistyped it.
    tests:
      - packages/daemon/test/ipc.test.ts::fingerprint-changes-with-passphrase

  - id: INV-IPC-1
    statement: >
      Errors are reported to the caller rather than swallowed, and a failing
      request never returns a result.
    tests:
      - packages/daemon/test/ipc.test.ts::reports-errors-without-swallowing-them

  - id: INV-IPC-2
    statement: >
      Both hardened path notations reach the same key across the IPC boundary,
      and the canonical form is returned.
    tests:
      - packages/daemon/test/ipc.test.ts::normalizes-path-notation-across-ipc

  - id: INV-IPC-3
    statement: The attestation method serves the manifest root hash to the lock screen.
    tests:
      - packages/daemon/test/ipc.test.ts::serves-attestation

  # --- Phase 4 surface -------------------------------------------------------
  - id: INV-DAEMON-20
    statement: >
      Message review reports the commitment a verifier recomputes and refuses a
      message that would display differently from what is signed. Signing runs
      the review again rather than trusting an earlier call, names the address
      that proves it, and is gated on an unlocked wallet.
    tests:
      - packages/daemon/test/phase4.ipc.test.ts::reports-the-commitment-a-verifier-will-recompute
      - packages/daemon/test/phase4.ipc.test.ts::refuses-a-message-that-would-display-differently-from-what-is-signed
      - packages/daemon/test/phase4.ipc.test.ts::signs-a-message-and-names-the-address-that-proves-it
      - packages/daemon/test/phase4.ipc.test.ts::refuses-to-sign-a-message-the-review-refuses
      - packages/daemon/test/phase4.ipc.test.ts::refuses-to-sign-with-no-wallet-loaded

  - id: INV-DAEMON-23
    statement: >
      The signing scheme is chosen from the script type and the verifying
      scheme from the address, never from a parameter, so no request can ask
      for one and receive the other. Verification needs no seed and works with
      the wallet locked, and a refusal crosses the boundary as a result rather
      than as a failed request.
    tests:
      - packages/daemon/test/phase4.ipc.test.ts::signs-taproot-and-checks-its-own-proof
      - packages/daemon/test/phase4.ipc.test.ts::routes-a-legacy-address-to-the-older-scheme-and-says-so
      - packages/daemon/test/phase4.ipc.test.ts::checks-a-proof-with-no-wallet-loaded-at-all
      - packages/daemon/test/phase4.ipc.test.ts::returns-a-refusal-rather-than-failing-the-request

  - id: INV-DAEMON-21
    statement: >
      Labels cross the boundary as text, with the dropped lines reported and a
      statement that a label decides nothing about ownership.
    tests:
      - packages/daemon/test/phase4.ipc.test.ts::imports-and-exports-without-deciding-anything
      - packages/daemon/test/phase4.ipc.test.ts::refuses-an-export-that-is-not-a-list

  - id: INV-DAEMON-22
    statement: >
      A BIP-85 child is returned with the path that produced it, is gated on an
      unlocked wallet, refuses parameters the standard does not allow, and is
      never written to the device.
    tests:
      - packages/daemon/test/phase4.ipc.test.ts::returns-a-child-with-the-path-that-produced-it
      - packages/daemon/test/phase4.ipc.test.ts::derives-hex-and-passwords-too
      - packages/daemon/test/phase4.ipc.test.ts::refuses-an-application-it-does-not-know
      - packages/daemon/test/phase4.ipc.test.ts::refuses-parameters-the-standard-does-not-allow
      - packages/daemon/test/phase4.ipc.test.ts::refuses-when-no-wallet-is-loaded
      - packages/daemon/test/phase4.ipc.test.ts::writes-nothing-to-the-device

  - id: INV-BOOT-1
    statement: >
      The device reports the dm-verity root hash of the mapping it is running
      on, read from the live device-mapper table rather than from the boot
      partition, and reports nothing at all where there is no mapping.
    tests:
      - packages/daemon/test/verity-attestation.test.ts::reports-the-root-hash-of-the-running-mapping
      - packages/daemon/test/verity-attestation.test.ts::reports-nothing-rather-than-a-blank-where-there-is-no-mapping
      - packages/daemon/test/verity-attestation.test.ts::refuses-anything-that-is-not-a-root-hash

  - id: INV-BUILD-1
    statement: >
      The daemon starts only on a verification report that passed, records at
      least one check and no failed or unrecognised ones, and names the
      SHA-256 of the MANIFEST.lock on disk. It compares that one hash and opens
      no source file: file contents are covered by the verifier's integrity
      check and, on a device, by dm-verity.
    tests:
      - packages/daemon/test/verification-gate.test.ts::starts-on-a-passing-report-that-describes-this-build
      - packages/daemon/test/verification-gate.test.ts::refuses-a-missing-or-unreadable-report
      - packages/daemon/test/verification-gate.test.ts::refuses-a-report-that-did-not-pass-or-contradicts-itself
      - packages/daemon/test/verification-gate.test.ts::refuses-a-report-that-records-no-checks
      - packages/daemon/test/verification-gate.test.ts::refuses-a-report-that-describes-another-build

threats:
  - INV-NET-1
  - INV-NET-2
  - INV-KEY-1
  - INV-BUILD-1

security_notes: >
  assertNoNetworkListeners reads a Node internal that is not a public API. Its
  absence is tolerated rather than fatal, because two other defences cover the
  same invariant and fail differently: the lint rule proves no source file can
  open a socket, and the systemd unit sets RestrictAddressFamilies=AF_UNIX with
  IPAddressDeny=any so the kernel refuses regardless. Three checks at three
  layers, none of which is sufficient alone.

  The method table returns public material by construction rather than by
  filtering. There is no method that returns a seed and no debug flag that
  enables one. The INV-KEY-1 test searches serialised responses rather than
  inspecting each method, because the realistic failure is a richer object than
  intended or an error message interpolating something it should not, not a
  method deliberately returning a key.

  The socket is 0660 and was 0600. The sentence below used to say that if the
  daemon ever served a second client the assumption had to be revisited rather
  than inherited, and it now has one: the loopback bridge (daemon.bridge), which
  exists because the frontend is a page in a browser and a browser cannot open a
  Unix socket. The bridge runs as its own user in this daemon's group.

  So the claim is narrower and is stated as such: not that no other user can
  open the socket, but that only a member of the daemon's group can. Running the
  bridge as this daemon's own user would have kept 0600 and put a browser-facing
  HTTP parser inside the principal holding the seed, which is worse. The state
  directory remains 0700, so the bridge can talk to the socket and cannot read
  the store.

  TIER 1'S HALF OF THE ATTESTATION, and what it is worth. The manifest root
  says the application is the published one and says nothing about the operating
  system underneath it. INV-BOOT-1 adds the dm-verity root hash of the mapping
  the device is running on, so a user comparing numbers against a release is
  comparing two things rather than one.

  It is read from the live device-mapper table by a separate privileged unit,
  not from /boot/system.roothash. That file sits on the one partition the hash
  tree cannot cover, so it reports what somebody wrote rather than what is in
  force. Neither answer defends against an attacker who rewrote the boot
  partition, because they would supply a hash and the initramfs would open a
  mapping against it: only a signed boot chain closes that, and it is tier 2.
  The difference is that one number describes something running.

  Null rather than empty where there is no mapping. A blank on the lock screen
  reads as a value that has not loaded, and a device with no verity should say
  so by the absence of a hash.

  This module does not authenticate its caller. On the device the only client is
  the bridge, reaching a socket the browser's own user cannot open. If anything
  else ever connects, that has to be revisited rather than inherited.

references:
  - docs/THREAT-MODEL.md
  - docs/VERIFICATION.md
  - systemd.exec(5), RestrictAddressFamilies and IPAddressDeny
