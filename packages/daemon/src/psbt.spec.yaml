id: daemon.psbt
version: 1
title: Wallet ownership index for transaction review and signing
assurance_tier: critical
status: implemented

purpose: >
  Answer one question, correctly, as many times as a transaction requires it: is
  this address mine, and at what derivation path? Every guarantee the review
  screen makes rests on that answer coming from re-derivation rather than from
  anything the transaction asserts about itself.

covers:
  - packages/daemon/src/psbt.ts::SCRIPT_TYPES
  - packages/daemon/src/psbt.ts::buildOwnedIndex
  - packages/daemon/src/psbt.ts::changeLookup
  - packages/daemon/src/psbt.ts::signingPathsFor

algorithm: >
  The index is built by deriving every address this wallet can produce within a
  gap limit, across all four script types and both the receive and change
  branches, and keying them by exact address string. Lookup is exact match.

  Change detection returns a path only for an address that both re-derives and
  sits on the change branch. A receive address of ours appearing as an output is
  a self-send, and is deliberately NOT labelled change.

  Signing paths are found by mapping each input's locking script back to an
  address and looking it up. An input the wallet does not own contributes no
  path, which is normal rather than an error, because this device may hold one
  key of a quorum.

invariants:
  - id: INV-PSBT-12
    statement: >
      Change is identified by re-derivation from the seed. A derivation hint
      carried inside the PSBT cannot cause an address to be labelled change,
      because no field of the PSBT is consulted.
    tests:
      - packages/daemon/test/psbt.test.ts::labels-change-only-from-re-derivation
      - packages/daemon/test/psbt.test.ts::ignores-a-derivation-hint-in-the-psbt

  - id: INV-PSBT-13
    statement: >
      A receive address of this wallet appearing as an output is reported as a
      payment, not as change.
    tests:
      - packages/daemon/test/psbt.test.ts::does-not-call-a-self-send-change

  - id: INV-PSBT-16
    statement: >
      Addresses of a registered multisig quorum are part of the wallet's own
      view, so its change is recognised as change and its inputs are signable.
      A registration this device is not in, or one that no longer reads,
      contributes nothing rather than throwing.
    tests:
      - packages/daemon/test/psbt.test.ts::recognises-change-from-a-registered-quorum
      - packages/daemon/test/psbt.test.ts::signs-a-multisig-input-with-our-own-derivation
      - packages/daemon/test/psbt.test.ts::does-not-call-a-multisig-receive-address-change
      - packages/daemon/test/psbt.test.ts::ignores-a-registration-this-device-is-not-in
      - packages/daemon/test/psbt.test.ts::skips-an-unreadable-registration-rather-than-throwing

  - id: INV-PSBT-14
    statement: >
      Signing paths are derived from the inputs' own locking scripts. A
      transaction whose inputs this wallet does not own yields no paths, and the
      daemon refuses to sign it rather than producing an unsigned result.
    tests:
      - packages/daemon/test/psbt.test.ts::finds-the-path-that-owns-an-input
      - packages/daemon/test/psbt.test.ts::finds-nothing-for-a-foreign-input

vectors:
  - name: Signer profile SP-REV-6, SP-REV-7, change by re-derivation
    file: spec/vectors/signer-profile/review-change.json
    sha256: 743ae45d75f625eab1ef28275d01a8f39a940a4cae2b1fbc64476d118154ee3a
    source: conformance/README.md; run by make conformance
  - name: Signer profile SP-REV-24, SP-REV-25, ownership
    file: spec/vectors/signer-profile/review-ownership.json
    sha256: 24b2e951224a24c04472767483eeb1b10022d37131245fb9186f4332b7474f87
    source: conformance/README.md; run by make conformance

threats:
  - INV-PSBT-2
  - INV-PSBT-12

security_notes: >
  The gap limit is a real bound on what this can detect, and it is the one place
  this module can be wrong in a way that matters. An output paying a change
  address beyond the limit is reported as a payment to a stranger. That is the
  safe direction: the user sees a warning about money leaving rather than a
  reassuring "change" label on an address the device never actually verified.
  Being wrong the other way, labelling something change without deriving it,
  would be the exact attack INV-PSBT-2 exists to stop.

  Building the index derives up to 800 addresses (four script types, two
  branches, one hundred each), which takes long enough to notice on a Pi. It is
  rebuilt per request rather than cached, because a cache keyed on anything
  mutable would be a way to make the device answer questions about the wrong
  wallet after a lock and unlock. Correctness beats latency here.

  This module holds the seed only for the duration of the derivation and wipes
  the root key in a `finally`. That is best effort in a garbage-collected
  runtime, and the real mitigations are architectural: no swap and a short-lived
  process. See docs/PROVISIONING.md.

  Nothing here validates the transaction. Amounts, fees and sighash policy are
  review's job, and keeping ownership separate from policy means neither can
  quietly weaken the other.

  A registered quorum contributes its addresses to the same index, mapped to the
  path THIS device signs with rather than the descriptor's own. Every cosigner
  reaches the same address by a different derivation, and the signing path is
  the only one that is any use afterwards.

  A registration that no longer parses, or that no longer contains this device's
  key, is skipped rather than raised. It was verified when it was registered, so
  reaching that state means something changed underneath, and refusing to review
  any transaction at all would be a worse failure than reviewing this one with a
  quorum's outputs shown as payments. The bias stays in the safe direction: an
  unrecognised output is a payment, never a reassuring change label.

references:
  - BIP-32, Hierarchical Deterministic Wallets
  - BIP-174, Partially Signed Bitcoin Transaction Format
  - docs/THREAT-MODEL.md
