security_notes: >
  The values on this screen are reported by the software being looked at. That
  is stated on the screen itself rather than in the documentation, because it is
  the single most consequential place in the product to overclaim. They catch an
  accident, a failed write, and an unsophisticated substitution. Until the boot
  chain is signed (provisioning tier 2), they do not catch an attacker who
  replaced the code that draws them.

  Unlock is not the focused default action, so a stray tap cannot carry a user
  past the one screen asking them to look. There is no animation: motion belongs
  to progress indicators, and a security screen that moves invites a glance
  rather than a read.

  This package receives xpubs, addresses, descriptors and PSBTs, and never a
  seed, a mnemonic or a private key (INV-KEY-1). It also never generates
  entropy: a lint rule bans crypto.getRandomValues here, because entropy
  collection happens in the daemon or it does not happen at all.

  The fingerprint shown here cannot detect a wrong passphrase. Nothing can. It
  only lets a user who recorded the correct value notice a mismatch, which
  depends on them having recorded it.

  THE QR DECODER IS THE ONE DEPENDENCY THAT COULD REACH THE NETWORK. zxing-wasm
  ships a default that resolves its WebAssembly to a CDN. On this device that is
  both a capability that must not exist and a screen that hangs in the field
  while working perfectly on a developer's machine, because the developer's
  machine can answer the request. The binary is therefore imported through the
  bundler and served from the same loopback origin as the rest of the
  application, and INV-UI-23 checks that rather than trusting anyone to remember
  it.

  Decoding is the one job here worth a dependency. Reading a code from a camera
  means binarisation under uneven light, perspective correction, and error
  correction over a partly misread matrix; the failure mode of getting it wrong
  is accepting a payload that is not what was on the other screen. The encoder
  is in the tree because drawing is tractable and lands in the manifest. The
  decoder is not, and that asymmetry is deliberate rather than inconsistent.

  Nothing scanned is trusted. A completed payload is a candidate that goes to
  the ordinary parser and the ordinary review screen. The BBQr file type says
  what to try first and is never a permission: a payload announcing itself as a
  PSBT still has to survive the parser and still has to be read by a human.

  The code is drawn dark on white with a quiet zone even though the rest of the
  interface is dark, which is the one place the palette is deliberately ignored.
  Scanners look for a light margin, and an inverted code without one is a code
  most phones refuse.

  THE KEYBOARDS HAVE OPPOSITE JOBS AND ARE SEPARATE FOR THAT REASON. The word
  keyboard narrows a finger down to a list of 2048 known words, and can afford
  to be opinionated because every possible answer is known in advance. The text
  keyboard must accept any string at all, including one the user will never be
  able to reproduce if they get it wrong, and it can help with nothing.

  The word keyboard has exactly one way to lose someone money, and INV-UI-27 is
  it. `act` is a word, and so are `action`, `actor`, `actress` and `actual`. A
  user who typed `act` meaning `act` and a user on their way to `actual` are
  indistinguishable to the software, so it must not choose. Auto-entry happens
  only when a single word remains possible.

  The text keyboard transforms nothing. No autocorrect, no capitalisation of a
  first letter, no trimming of a trailing space. Any of those would derive a
  different wallet, silently, with no error and no way for the user to discover
  which character was altered. This is why it is a purpose-built component
  rather than a system keyboard: a system keyboard's helpfulness is a hazard
  here.

  Dead letter keys go dim in place rather than disappearing. A key that moves
  as you type is a key you mis-hit, and this is a screen where a mis-hit is a
  wrong word in a mnemonic.

