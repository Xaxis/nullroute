id: ui.screens.lock
version: 1
title: Lock screen and device attestation display
assurance_tier: critical
status: implemented

purpose: >
  Put the device's own attestation in front of a user before they enter a PIN,
  so that a swapped, modified or unverified device can be noticed rather than
  merely feared. This is the screen the whole verification apparatus reports to,
  and the last point at which a user can decline.

covers:
  - packages/ui/src/screens/LockScreen.tsx::LockScreen
  - packages/ui/src/screens/SetupScreen.tsx::SetupScreen
  - packages/ui/src/screens/DiceScreen.tsx::DiceScreen
  - packages/ui/src/screens/SeedScreen.tsx::SeedScreen
  - packages/ui/src/screens/ImportScreen.tsx::ImportScreen
  - packages/ui/src/screens/WalletScreen.tsx::WalletScreen
  - packages/ui/src/screens/PsbtScreen.tsx::PsbtScreen
  - packages/ui/src/screens/PassphraseScreen.tsx::PassphraseScreen
  - packages/ui/src/screens/MultisigScreen.tsx::MultisigScreen
  - packages/ui/src/components/Screen.tsx::Screen
  - packages/ui/src/components/Button.tsx::Button
  - packages/ui/src/components/Choice.tsx::Choice
  - packages/ui/src/components/Hash.tsx::Hash
  - packages/ui/src/components/Hash.tsx::chunk
  - packages/ui/src/components/Hash.tsx::abbreviate
  - packages/ui/src/components/NetworkBanner.tsx::NetworkBanner
  - packages/ui/src/lib/client.ts::call
  - packages/ui/src/lib/client.ts::IpcCallError
  - packages/ui/src/screens/ScanScreen.tsx::ScanScreen
  - packages/ui/src/components/QrDisplay.tsx::QrDisplay
  - packages/ui/src/lib/scanner.ts::assertSameOrigin
  - packages/ui/src/lib/scanner.ts::wasmLocation
  - packages/ui/src/lib/scanner.ts::prepareScanner
  - packages/ui/src/lib/scanner.ts::decodeFrame
  - packages/ui/src/lib/scanner.ts::ScannerError
  - packages/ui/src/components/WordKeyboard.tsx::WordKeyboard
  - packages/ui/src/components/TextKeyboard.tsx::TextKeyboard
  - packages/ui/src/screens/WalletsScreen.tsx::WalletsScreen
  - packages/ui/src/components/WalletChip.tsx::WalletChip
  - packages/ui/src/screens/UnlockedScreen.tsx::UnlockedScreen
  - packages/ui/src/screens/MessageScreen.tsx::MessageScreen
  - packages/ui/src/screens/MessageScreen.tsx::MESSAGE_SCRIPT_TYPES

algorithm: >
  Renders the manifest root hash, the verification status with spec and
  invariant counts, the build tier, and where a wallet exists its fingerprint.

  Hashes are chunked in groups of four and shown abbreviated as first eight and
  last eight characters, expanding on tap. Four is the span a person can hold
  while glancing between two screens; a full unbroken 64 characters gets skimmed,
  and a skimmed hash is worse than an abbreviated one because it feels like it
  was read.

  Unlock is disabled outright when any check failed. The screen states the limit
  of what its own numbers prove.

invariants:
  - id: INV-UI-1
    statement: The lock screen displays the manifest root hash before unlock.
    tests:
      - packages/ui/test/lock-screen.test.tsx::shows-the-manifest-root-hash
      - packages/ui/test/lock-screen.test.tsx::expands-to-the-full-hash

  - id: INV-UI-2
    statement: >
      A failed verification disables unlock and says so plainly. It warns and
      then proceeds under no circumstances.
    tests:
      - packages/ui/test/lock-screen.test.tsx::blocks-unlock-when-verification-failed

  - id: INV-UI-3
    statement: >
      A non-mainnet wallet carries a persistent banner naming the network, since
      signet, testnet3 and testnet4 are otherwise indistinguishable.
    tests:
      - packages/ui/test/lock-screen.test.tsx::shows-a-persistent-banner-off-mainnet
      - packages/ui/test/lock-screen.test.tsx::shows-no-banner-on-mainnet

  - id: INV-UI-4
    statement: >
      The wallet fingerprint is shown before unlock, which is the only signal a
      user gets that a passphrase was mistyped.
    tests:
      - packages/ui/test/lock-screen.test.tsx::shows-the-wallet-fingerprint-before-unlock

  - id: INV-UI-5
    statement: >
      The screen states that its own values are reported by the software being
      looked at, rather than implying they are independent proof.
    tests:
      - packages/ui/test/lock-screen.test.tsx::states-the-limit-of-what-these-numbers-prove

  - id: INV-UI-6
    statement: Hashes render chunked and abbreviated consistently.
    tests:
      - packages/ui/test/lock-screen.test.tsx::chunks-in-groups-of-four
      - packages/ui/test/lock-screen.test.tsx::abbreviates-to-first-and-last-eight

  - id: INV-UI-7
    statement: >
      Dice entropy accounting is displayed as the daemon reports it, and the
      continue action is unavailable until enough entropy has been collected.
    tests:
      - packages/ui/test/dice-screen.test.tsx::shows-accounting-from-the-daemon
      - packages/ui/test/dice-screen.test.tsx::blocks-continue-until-sufficient

  - id: INV-UI-8
    statement: >
      A pattern warning is displayed and does NOT prevent the user proceeding.
      The device does not discard a user's rolls.
    tests:
      - packages/ui/test/dice-screen.test.tsx::warns-without-blocking

  - id: INV-UI-9
    statement: >
      The rolls entered remain visible in order, so the user can check them
      against what they rolled and reproduce the hash elsewhere.
    tests:
      - packages/ui/test/dice-screen.test.tsx::keeps-the-rolls-visible

  - id: INV-UI-10
    statement: >
      Confirming a seed backup requires an explicit acknowledgement and is
      styled as irreversible rather than as the obvious next step.
    tests:
      - packages/ui/test/seed-screen.test.tsx::requires-acknowledgement
      - packages/ui/test/seed-screen.test.tsx::warns-that-this-is-the-only-showing

  # --- The signing screen -------------------------------------------------
  # Until this screen existed the device could derive addresses and nothing
  # else: a signing device that could not sign.
  - id: INV-UI-11
    statement: >
      Reviewing a transaction never signs it. Signing is a separate action that
      only becomes available after a review has been rendered.
    tests:
      - packages/ui/test/psbt-screen.test.tsx::does-not-sign-when-reviewing
      - packages/ui/test/psbt-screen.test.tsx::will-not-review-an-empty-field

  - id: INV-UI-12
    statement: >
      An output is presented as change only together with the derivation path
      the device re-derived it at. Every other output is presented as money
      leaving the wallet.
    tests:
      - packages/ui/test/psbt-screen.test.tsx::shows-the-change-path-it-verified
      - packages/ui/test/psbt-screen.test.tsx::shows-the-fee-in-several-units

  - id: INV-UI-13
    statement: >
      A blocking warning disables signing. It can only be lifted by an explicit
      per-signature override that is not remembered.
    tests:
      - packages/ui/test/psbt-screen.test.tsx::refuses-to-sign-when-a-warning-is-blocking
      - packages/ui/test/psbt-screen.test.tsx::allows-an-explicit-override-of-a-blocking-warning

  - id: INV-UI-14
    statement: >
      A transaction with no inputs belonging to this wallet cannot be signed,
      and the screen says so. A failure to review or to sign is displayed and
      never leaves a stale result on screen.
    tests:
      - packages/ui/test/psbt-screen.test.tsx::will-not-sign-a-transaction-it-does-not-own
      - packages/ui/test/psbt-screen.test.tsx::shows-an-error-and-clears-the-stale-review
      - packages/ui/test/psbt-screen.test.tsx::reports-a-signing-failure-rather-than-appearing-to-succeed
      - packages/ui/test/psbt-screen.test.tsx::shows-the-signed-psbt-and-the-paths-used

  # --- The passphrase screen ----------------------------------------------
  # One component for both setting and entering, because a difference between
  # what the two accept is a wallet nobody can open.
  - id: INV-UI-15
    statement: >
      Setting a passphrase requires it entered twice and identically. Unlocking
      asks once. Neither accepts an empty passphrase.
    tests:
      - packages/ui/test/passphrase-screen.test.tsx::requires-the-passphrase-twice-when-setting
      - packages/ui/test/passphrase-screen.test.tsx::does-not-ask-twice-when-unlocking
      - packages/ui/test/passphrase-screen.test.tsx::refuses-an-empty-passphrase

  - id: INV-UI-16
    statement: >
      The passphrase is never rendered readable on screen, and is not retained
      in component state after a successful submission.
    tests:
      - packages/ui/test/passphrase-screen.test.tsx::never-shows-the-passphrase
      - packages/ui/test/passphrase-screen.test.tsx::clears-the-passphrase-after-a-successful-submit

  - id: INV-UI-17
    statement: >
      The screen states how long a passphrase would take to guess rather than
      scoring it, shows how many attempts remain before erasure, and does not
      imply the attempt counter protects a stolen card.
    tests:
      - packages/ui/test/passphrase-screen.test.tsx::describes-the-cost-of-guessing-rather-than-a-score
      - packages/ui/test/passphrase-screen.test.tsx::shows-how-many-attempts-remain
      - packages/ui/test/passphrase-screen.test.tsx::does-not-overstate-what-the-counter-protects
      - packages/ui/test/passphrase-screen.test.tsx::reports-a-failure-and-stays-put
      - packages/ui/test/passphrase-screen.test.tsx::allows-skipping-when-setting-and-not-when-unlocking

  # --- Cosigner registration ----------------------------------------------
  - id: INV-UI-18
    statement: >
      This device's own multisig key is shown before a descriptor is asked for,
      with its path and fingerprint, and stated to be unable to spend.
    tests:
      - packages/ui/test/multisig-screen.test.tsx::shows-this-devices-key-to-hand-over
      - packages/ui/test/multisig-screen.test.tsx::will-not-check-an-empty-descriptor

  - id: INV-UI-19
    statement: >
      Checking a quorum never registers it. The review states the threshold and
      this device's position in words, and registration submits exactly the
      descriptor that was reviewed.
    tests:
      - packages/ui/test/multisig-screen.test.tsx::does-not-register-when-checking
      - packages/ui/test/multisig-screen.test.tsx::registers-only-what-was-reviewed
      - packages/ui/test/multisig-screen.test.tsx::shows-warnings-about-the-quorum-shape

  - id: INV-UI-20
    statement: >
      Only this device's own cosigner entry is marked verified. Every other key
      is labelled unverified, because the fingerprint beside it is chosen by
      whoever wrote the descriptor. A refusal is displayed and leaves no stale
      review on screen.
    tests:
      - packages/ui/test/multisig-screen.test.tsx::marks-every-cosigner-except-ours-as-unverified
      - packages/ui/test/multisig-screen.test.tsx::shows-a-refusal-and-keeps-nothing-stale

  # --- QR, both directions -------------------------------------------------
  # The air gap in practice. Everything that leaves the device leaves through a
  # code on the screen, and everything that arrives arrives through the camera.
  - id: INV-UI-21
    statement: >
      A payload too large for one code becomes a navigable sequence rather than
      an error or a truncation, the sequence reassembles into the payload, and a
      new payload restarts at the first frame.
    tests:
      - packages/ui/test/qr-display.test.tsx::splits-a-large-payload-into-a-navigable-sequence
      - packages/ui/test/qr-display.test.tsx::shows-frames-that-reassemble-into-the-payload
      - packages/ui/test/qr-display.test.tsx::resets-to-the-first-frame-when-the-payload-changes
      - packages/ui/test/qr-display.test.tsx::advances-on-its-own-and-stops-when-paused

  - id: INV-UI-22
    statement: >
      A code that fits in one frame is shown bare, not wrapped, so an ordinary
      scanner reads it, and every code is drawn dark on white with a quiet zone
      inside its own viewBox.
    tests:
      - packages/ui/test/qr-display.test.tsx::renders-a-single-frame-for-a-small-payload
      - packages/ui/test/qr-display.test.tsx::does-not-wrap-a-single-frame-in-a-bbqr-header
      - packages/ui/test/qr-display.test.tsx::keeps-the-code-dark-on-white-whatever-the-theme-is

  - id: INV-UI-23
    statement: >
      The QR decoder is loaded from this device and never from a network, and a
      location on any other origin is refused rather than fetched.
    tests:
      - packages/ui/test/scan-screen.test.tsx::refuses-a-decoder-location-that-is-not-on-this-origin
      - packages/ui/test/scan-screen.test.tsx::points-at-a-decoder-on-our-own-origin
      - packages/ui/test/scan-screen.test.tsx::accepts-a-bundled-asset-path

  - id: INV-UI-24
    statement: >
      Scanned frames from a second transfer are refused and reported rather than
      assembled, a payload that is not a sequence is returned directly, and
      progress names the frames still outstanding.
    tests:
      - packages/ui/test/scan-screen.test.tsx::refuses-frames-from-a-second-transfer-and-says-so
      - packages/ui/test/scan-screen.test.tsx::returns-a-plain-payload-without-waiting-for-a-sequence
      - packages/ui/test/scan-screen.test.tsx::assembles-a-sequence-arriving-out-of-order
      - packages/ui/test/scan-screen.test.tsx::shows-which-frames-it-is-still-waiting-for

  - id: INV-UI-25
    statement: >
      The camera is released when the scanner goes away, and a camera that will
      not open is reported rather than left as a blank screen.
    tests:
      - packages/ui/test/scan-screen.test.tsx::releases-the-camera-when-it-goes-away
      - packages/ui/test/scan-screen.test.tsx::reports-a-camera-that-will-not-open

  # --- Typing, on a device with no keyboard --------------------------------
  # Without these the device cannot be used at all: a mnemonic could not be
  # entered by finger, which makes recovery impossible on the hardware.
  - id: INV-UI-26
    statement: >
      The word keyboard disables every letter that cannot reach a BIP-39 word,
      without moving the keys, and enters a word as soon as only one remains.
    tests:
      - packages/ui/test/keyboard.test.tsx::disables-letters-that-cannot-reach-a-word
      - packages/ui/test/keyboard.test.tsx::commits-a-word-as-soon-as-only-one-is-possible
      - packages/ui/test/keyboard.test.tsx::counts-towards-a-target

  - id: INV-UI-27
    statement: >
      A word that is also the prefix of a longer word is never entered
      automatically. Both remain reachable and the choice stays with the user.
      A word may be entered more than once, and backspace removes a letter
      before it removes a word.
    tests:
      - packages/ui/test/keyboard.test.tsx::never-commits-a-short-word-that-is-also-a-prefix
      - packages/ui/test/keyboard.test.tsx::commits-the-suggestion-the-user-taps
      - packages/ui/test/keyboard.test.tsx::allows-the-same-word-more-than-once
      - packages/ui/test/keyboard.test.tsx::backspaces-into-the-prefix-first-and-then-the-words

  - id: INV-UI-28
    statement: >
      The text keyboard types exactly what was tapped. No autocorrect, no
      automatic capitalisation, and a space is kept rather than trimmed. Shift
      applies to one character.
    tests:
      - packages/ui/test/keyboard.test.tsx::types-exactly-what-was-tapped
      - packages/ui/test/keyboard.test.tsx::applies-shift-once-and-then-releases-it
      - packages/ui/test/keyboard.test.tsx::types-a-space-without-trimming-it
      - packages/ui/test/keyboard.test.tsx::reaches-digits-and-symbols

  - id: INV-UI-29
    statement: >
      A passphrase is hidden until the user asks to see it, and its length is
      shown either way so a user can tell that a key registered.
    tests:
      - packages/ui/test/keyboard.test.tsx::hides-the-value-until-asked-and-always-shows-the-length
      - packages/ui/test/keyboard.test.tsx::backspaces-and-refuses-to-when-empty
      - packages/ui/test/keyboard.test.tsx::offers-a-return-key-only-when-there-is-somewhere-to-go

  # --- Several wallets ------------------------------------------------------
  # A device holding more than one has one failure worth most of the design:
  # signing with a wallet the user did not choose.
  - id: INV-UI-30
    statement: >
      The picker presents nothing as verified. It says so in text that cannot be
      dismissed, shows no fingerprint, names the network on every row including
      mainnet, and never uses colour as the only difference between two rows.
    tests:
      - packages/ui/test/wallets-screen.test.tsx::says-plainly-that-nothing-here-is-confirmed-yet
      - packages/ui/test/wallets-screen.test.tsx::always-names-the-network-including-mainnet
      - packages/ui/test/wallets-screen.test.tsx::shows-the-label-beside-every-colour
      - packages/ui/test/wallets-screen.test.tsx::shows-an-empty-device-honestly
      - packages/ui/test/wallets-screen.test.tsx::never-renders-a-failed-list-as-an-empty-device

  - id: INV-UI-31
    statement: >
      The active wallet is named on every screen, with its network, mainnet
      included, and described for a reader who cannot distinguish the colours.
    tests:
      - packages/ui/test/wallets-screen.test.tsx::names-the-network-on-mainnet-too
      - packages/ui/test/wallets-screen.test.tsx::marks-a-test-network-differently
      - packages/ui/test/wallets-screen.test.tsx::describes-itself-for-a-reader-that-cannot-see-colour

  - id: INV-UI-32
    statement: >
      Unlocking one wallet asks for a passphrase under that wallet's name, shows
      the attempts remaining and what exhausting them does, clears the field on
      a failure, and refuses to add a wallet past the device limit.
    tests:
      - packages/ui/test/wallets-screen.test.tsx::takes-a-passphrase-for-the-wallet-that-was-tapped
      - packages/ui/test/wallets-screen.test.tsx::clears-the-passphrase-after-a-failure
      - packages/ui/test/wallets-screen.test.tsx::states-what-the-attempt-counter-does-and-does-not-do
      - packages/ui/test/wallets-screen.test.tsx::refuses-to-add-a-wallet-past-the-limit
      - packages/ui/test/wallets-screen.test.tsx::marks-the-open-wallet-and-disables-an-erased-one

  # --- What just opened ------------------------------------------------------
  # A wrong BIP-39 passphrase produces no error. It derives a different, valid,
  # empty wallet, and every screen after this one looks normal.
  - id: INV-UI-33
    statement: >
      A wallet that has just opened shows its fingerprint before it can be
      used, says what a mismatch means, admits that it helps nobody who did not
      record one, and does not make continuing the focused default.
    tests:
      - packages/ui/test/unlocked-screen.test.tsx::shows-the-fingerprint-and-what-a-mismatch-means
      - packages/ui/test/unlocked-screen.test.tsx::offers-a-way-out-that-is-not-the-primary-action
      - packages/ui/test/unlocked-screen.test.tsx::names-the-network-and-marks-a-test-one

  - id: INV-UI-34
    statement: >
      A wallet made with a BIP-39 passphrase says so in the words that matter,
      a wallet whose name is not sealed says the name is unconfirmed, and a
      picker that disagreed with the ciphertext is reported. None of these
      appear on an ordinary unlock.
    tests:
      - packages/ui/test/unlocked-screen.test.tsx::warns-specifically-when-the-wallet-uses-a-passphrase
      - packages/ui/test/unlocked-screen.test.tsx::says-when-the-name-is-not-confirmed
      - packages/ui/test/unlocked-screen.test.tsx::reports-that-the-picker-was-showing-something-else
      - packages/ui/test/unlocked-screen.test.tsx::says-nothing-about-passphrases-when-none-was-used
      - packages/ui/test/unlocked-screen.test.tsx::shows-nothing-alarming-on-an-ordinary-unlock

  # --- The fleet case --------------------------------------------------------
  # Several of these devices holding one multisig wallet. Signing first and
  # signing last are different acts and the screen has to say which.
  - id: INV-UI-35
    statement: >
      Before signing, the review says how many signatures are present, how many
      are needed, how many cosigners there are, and whether this device's
      signature would be the last one.
    tests:
      - packages/ui/test/psbt-screen.test.tsx::says-before-signing-that-yours-is-not-the-last-signature
      - packages/ui/test/psbt-screen.test.tsx::says-before-signing-when-yours-completes-it
      - packages/ui/test/psbt-screen.test.tsx::shows-no-quorum-panel-when-there-is-nothing-to-say

  - id: INV-UI-36
    statement: >
      After signing, a transaction that cannot be broadcast says so unmissably
      and offers no finished form, and one that can offers the raw transaction
      alongside the PSBT. A device that had already signed says so.
    tests:
      - packages/ui/test/psbt-screen.test.tsx::says-after-signing-that-the-transaction-cannot-be-broadcast-yet
      - packages/ui/test/psbt-screen.test.tsx::offers-the-finished-transaction-when-nothing-else-has-to-sign
      - packages/ui/test/psbt-screen.test.tsx::says-when-this-device-had-already-signed

  - id: INV-UI-37
    statement: >
      A device in a quorum says which cosigner it is and of how many, says so
      when it cannot place itself rather than showing a guess, and shows nothing
      for a single-signature wallet.
    tests:
      - packages/ui/test/wallet-screen.test.tsx::says-which-cosigner-of-how-many-this-device-is
      - packages/ui/test/wallet-screen.test.tsx::says-when-it-cannot-place-itself-rather-than-showing-a-number
      - packages/ui/test/wallet-screen.test.tsx::shows-nothing-for-a-single-signature-wallet
      - packages/ui/test/wallet-screen.test.tsx::lists-every-quorum-when-a-device-is-in-more-than-one

  # --- Proving control of an address ----------------------------------------
  # The signing screen's risk in a smaller package: a signature is a proof that
  # whoever holds the key agreed to a specific string.
  - id: INV-UI-38
    statement: >
      Reviewing a message never signs it, and the message is shown in full with
      the commitment a verifier recomputes.
    tests:
      - packages/ui/test/message-screen.test.tsx::does-not-sign-when-reviewing
      - packages/ui/test/message-screen.test.tsx::shows-the-whole-message-and-what-a-verifier-recomputes
      - packages/ui/test/message-screen.test.tsx::reports-a-failure-and-leaves-nothing-stale

  - id: INV-UI-39
    statement: >
      A refused message cannot be signed and there is no override, warnings do
      not block, and what leaves the device is the address, the message and the
      signature together.
    tests:
      - packages/ui/test/message-screen.test.tsx::refuses-to-sign-a-message-the-review-rejected
      - packages/ui/test/message-screen.test.tsx::shows-warnings-without-blocking
      - packages/ui/test/message-screen.test.tsx::hands-over-everything-a-verifier-needs
      - packages/ui/test/message-screen.test.tsx::signs-with-the-path-the-chosen-script-type-implies

threats:
  - INV-KEY-1
  - INV-BUILD-1

security_notes: >
  The values on this screen are reported by the software being looked at. That
  is stated on the screen itself rather than in the documentation, because it is
  the single most consequential place in the product to overclaim. They catch an
  accident, a failed write, and an unsophisticated substitution. Until the boot
  chain is signed (provisioning tier 2), they do not catch an attacker who
  replaced the code that draws them.

  Unlock is not the focused default action, so a stray tap cannot carry a user
  past the one screen asking them to look. There is no animation: motion belongs
  to progress indicators, and a security screen that moves invites a glance
  rather than a read.

  This package receives xpubs, addresses, descriptors and PSBTs, and never a
  seed, a mnemonic or a private key (INV-KEY-1). It also never generates
  entropy: a lint rule bans crypto.getRandomValues here, because entropy
  collection happens in the daemon or it does not happen at all.

  The fingerprint shown here cannot detect a wrong passphrase. Nothing can. It
  only lets a user who recorded the correct value notice a mismatch, which
  depends on them having recorded it.

  THE QR DECODER IS THE ONE DEPENDENCY THAT COULD REACH THE NETWORK. zxing-wasm
  ships a default that resolves its WebAssembly to a CDN. On this device that is
  both a capability that must not exist and a screen that hangs in the field
  while working perfectly on a developer's machine, because the developer's
  machine can answer the request. The binary is therefore imported through the
  bundler and served from the same loopback origin as the rest of the
  application, and INV-UI-23 checks that rather than trusting anyone to remember
  it.

  Decoding is the one job here worth a dependency. Reading a code from a camera
  means binarisation under uneven light, perspective correction, and error
  correction over a partly misread matrix; the failure mode of getting it wrong
  is accepting a payload that is not what was on the other screen. The encoder
  is in the tree because drawing is tractable and lands in the manifest. The
  decoder is not, and that asymmetry is deliberate rather than inconsistent.

  Nothing scanned is trusted. A completed payload is a candidate that goes to
  the ordinary parser and the ordinary review screen. The BBQr file type says
  what to try first and is never a permission: a payload announcing itself as a
  PSBT still has to survive the parser and still has to be read by a human.

  The code is drawn dark on white with a quiet zone even though the rest of the
  interface is dark, which is the one place the palette is deliberately ignored.
  Scanners look for a light margin, and an inverted code without one is a code
  most phones refuse.

  THE KEYBOARDS HAVE OPPOSITE JOBS AND ARE SEPARATE FOR THAT REASON. The word
  keyboard narrows a finger down to a list of 2048 known words, and can afford
  to be opinionated because every possible answer is known in advance. The text
  keyboard must accept any string at all, including one the user will never be
  able to reproduce if they get it wrong, and it can help with nothing.

  The word keyboard has exactly one way to lose someone money, and INV-UI-27 is
  it. `act` is a word, and so are `action`, `actor`, `actress` and `actual`. A
  user who typed `act` meaning `act` and a user on their way to `actual` are
  indistinguishable to the software, so it must not choose. Auto-entry happens
  only when a single word remains possible.

  The text keyboard transforms nothing. No autocorrect, no capitalisation of a
  first letter, no trimming of a trailing space. Any of those would derive a
  different wallet, silently, with no error and no way for the user to discover
  which character was altered. This is why it is a purpose-built component
  rather than a system keyboard: a system keyboard's helpfulness is a hazard
  here.

  Dead letter keys go dim in place rather than disappearing. A key that moves
  as you type is a key you mis-hit, and this is a screen where a mis-hit is a
  wrong word in a mnemonic.

