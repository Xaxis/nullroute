id: nullroute.os.signer
version: 1
title: Air-gapped signer, hardened base image
tier: 0
purpose: >
  State what must be true of a built nullroute image, in terms a verifier can
  check against the artifact rather than against the recipe that produced it.
  This is the contract a build backend has to satisfy. A backend is supported
  when the unchanged verifiers below pass against its output, and not before.

boards:
  # The design needs capabilities, not this model: arm64, enough memory, an
  # 800x480 display and a camera the kernel drives. A board is listed here when
  # the image has booted on it. research/pi-boards.md says what each other board
  # needs first.
  # raspberrypi-cm5 was here and is not any more. The pinned 6.12.94 kernel
  # ships nine Raspberry Pi device trees: bcm2711-rpi-4-b, -400 and -cm4-io,
  # bcm2712-rpi-5-b, and five bcm2837 trees (3-a-plus, 3-b, 3-b-plus, cm3-io3,
  # zero-2-w). None of them is a CM5, and mainline has none either. A board
  # named here that the artifact cannot start is the same class of claim as a
  # hardening rule nobody applies. It comes back when a kernel that has the
  # device tree does.
  # raspberrypi-5 was here and is not any more, for the same reason cm5 is not:
  # a board named here that cannot run the product is a claim nobody checked.
  # Debian's bcm2712-rpi-5-b.dtb has FIFTEEN device nodes to the Pi 4's seventy
  # four and contains no DSI anything at all, so the panel this device is built
  # around has nothing to attach to there. The mainline Pi 5 tree in this kernel
  # is a bring-up skeleton. It comes back when a kernel that describes the Pi 5's
  # display pipeline does.
  - raspberrypi-4

backends:
  # ADVISORY. The verifier is forbidden from reading this key (INV-PROV-2),
  # because an abstraction where the backend can influence its own verdict is
  # not an abstraction, it is a claim.
  - name: rpi-image-gen
    distribution: debian-trixie
    pin: v2.8.0
    status: planned
    notes: >
      The official Raspberry Pi builder. Its gpt/ab_userdata layout already
      implements an immutable erofs system partition with a dm-verity hash tree
      over it, A/B tryboot slots, and a separate persistent partition, which is
      most of what this profile asserts. It is built on mmdebstrap, which claims
      bit-for-bit reproducible output when SOURCE_DATE_EPOCH is set, and it
      pins packages against snapshot.debian.org.

      Two upstream defects have to be fixed before the reproducibility
      assertions can hold, and the first one is severe. Both were read out of
      upstream source rather than remembered, and both now have a patch in
      provisioning/backends/rpi-image-gen/patches/.

      image/gpt/ab_userdata/pre-image.sh builds its verity arguments with
      --salt $(uuidgen | tr -d '-'). The root hash is a function of (data,
      salt), so THE ROOT HASH CHANGES ON EVERY BUILD even when the filesystem
      is byte-identical, and the number this project most wants to publish
      becomes meaningless. INV-PROV-4's verifier reads the salt out of the
      superblock and fails on exactly this.

      The same script gives mke2fs -U $SYSTEM_UUID and never -E hash_seed=,
      leaving the ext4 directory index seed random per build. It changes
      nothing a user can see and it changes the bytes, so it is invisible in a
      file-level diff of the root filesystem.

      The recipe is written and HAS NEVER BEEN RUN, because the build needs
      mmdebstrap, veritysetup and genimage and this repository is developed on
      macOS. status stays planned until somebody runs it on Linux and
      make verify-image passes against the output.

      Pin the commit rather than the tag: v2.8.0 removed INI configuration
      support outright, so this project breaks between minor versions.

  - name: mkosi
    distribution: multiple
    status: planned
    notes: >
      The candidate second backend, and the reason the assertion/verifier split
      exists at all. It genuinely targets many distributions from one
      configuration. It is not first because its model is UEFI-centric and the
      Pi has no native UEFI, and because a systemd maintainer states plainly
      that nobody has tried it on a Pi.

  # Deliberately not listed as a backend: Buildroot. SeedSigner's architecture
  # (whole rootfs baked into the kernel image, so "verify the OS" collapses to
  # hashing one file) is philosophically better than what is chosen here, and
  # it is unavailable: the Pi boot ramdisk limit is 180 MB, and a Chromium
  # kiosk plus a Node daemon does not fit. The two-partition split is forced by
  # the platform, not preferred.

assertions:
  # --- Meta: the abstraction has to be falsifiable ------------------------
  - id: INV-PROV-1
    statement: >
      Every assertion in this profile carries at least one executable verifier.
    stage: image
    verify:
      - check: profile-self-check
    rationale: >
      The failure mode this whole design exists to avoid is a hardening rule
      that is documented, believed, and not applied. An assertion without a
      verifier is exactly that: it reads as a guarantee and checks nothing.
    does_not_cover: >
      That the verifiers are correct, or that they check what their assertion
      says. A verifier that always returns true satisfies this assertion.
      Verifier correctness belongs to test/provisioning, which now names every
      verifier the registry declares. UNTESTED_VERIFIERS in
      tools/checks/check-profiles.mjs is empty and is kept so: it refuses a
      verifier arriving with neither a test nor a line there, and refuses a line
      there for one the suite does test. A test naming a verifier is also not
      proof the verifier is right. Writing this suite found INV-PROV-2 enforced
      against half the syntax it meant to forbid.

  - id: INV-PROV-2
    statement: >
      The verifier never reads the `backends` key of any assertion, so a
      backend cannot influence its own verdict.
    stage: image
    verify:
      - check: verifier-ignores-backends
    rationale: >
      If the verifier consulted the backend, a backend that failed to implement
      a rule could describe itself as exempt from it. The verdict has to come
      from the artifact alone or the abstraction is decorative.
    does_not_cover: >
      Backends influencing the verdict indirectly by producing an artifact that
      happens to satisfy a weakly written verifier.

  - id: INV-PROV-34
    statement: >
      Every assertion in every profile says what it does not cover, in words
      rather than in whitespace.
    stage: image
    verify:
      - check: documented-weakness
    rationale: >
      A defence that is partial gets described as partial. That rule is the
      reason anyone should believe the rest of this file, and it is the one
      rule with nothing to inspect but the file itself. The schema requires the
      key and ten characters; ten characters of spaces satisfy a schema and
      concede nothing, which is what a required field invites when the field
      feels like a chore.

      DECLARED HERE BECAUSE IT WAS NOT DECLARED ANYWHERE. The rule was enforced
      from the start and had no id, so provisioning/schema.json and
      tools/checks/check-profiles.mjs each called it INV-PROV-34, which named
      nothing, while provisioning/checks/meta.mjs called it INV-PROV-13, which
      names the assertion below that no wireless or Bluetooth is present in the
      image. Someone checking whether the no-wireless invariant was verified was
      sent to the verifier for this one.
    does_not_cover: >
      Whether the concession is true, or complete, or describes the same gap the
      assertion actually has. It reads the shape of the sentence and not its
      meaning. An assertion conceding something irrelevant while hiding the real
      limit passes here, and only a reader catches that.

  # --- Determinism and identity -------------------------------------------
  - id: INV-PROV-3
    statement: >
      Two clean builds of the same commit produce byte-identical image files.
    stage: image
    verify:
      - check: rebuild-identical
        # Takes two artifacts. Given one it reports could-not-run rather than
        # passing: a reproducibility check that "passed" having compared one
        # file against nothing is the vacuous green this design exists to
        # prevent. See make verify-image IMAGE=... COMPARE=...
    rationale: >
      Everything else here is conditional on this. A published hash that a third
      party cannot arrive at independently is a number, not a check.
    does_not_cover: >
      Reproducibility across different machines, paths and architectures, which
      is a strictly stronger property and is not measured anywhere yet. What
      `make image-repro` establishes is two builds on one machine in two
      separate containers, which is weaker than it sounds and is not nothing:
      when both builds shared one container it reported success while four
      separate builds of the same commit were producing four different root
      hashes, because mmdebstrap had written the container's own hostname into
      /etc/hostname.
    standard: ['Reproducible Builds']

  - id: INV-PROV-5
    statement: >
      Every filesystem UUID, FAT volume id, GPT disk GUID and GPT partition GUID
      in the image is a pinned deterministic function of the release version.
    stage: image
    verify:
      - check: identifiers-pinned
        # WHICH partitions are pinned, and what filesystem each holds so the
        # right superblock is read. WHAT the pinned value is comes from
        # provisioning/checks/identifiers.mjs, derived from the release
        # version. The state partition is absent on purpose: it is created on
        # first boot and is deliberately not pinned.
        params:
          derive: true
          partitions:
            - { name: boot, filesystem: fat }
            - { name: system, filesystem: erofs }
    rationale: >
      Randomly generated identifiers are the most common single cause of an
      otherwise reproducible image failing to reproduce, and they are invisible
      in a file-level diff of the root filesystem.
    does_not_cover: >
      Identifiers created at runtime on first boot, such as the state partition
      created by the user, which are deliberately not pinned.

  # --- Image structure -----------------------------------------------------
  - id: INV-PROV-11
    statement: No swap device and no swap file exists, at build time or at runtime.
    stage: boot
    verify:
      - check: no-swap
    rationale: >
      Swap is how a seed reaches persistent storage in plaintext without anyone
      deciding that it should. On a device holding key material this is not a
      performance setting.
    does_not_cover: >
      Kernel memory reaching storage by other routes, such as a crash dump or
      hibernation image, which are separately disabled.
    standard: ['ANSSI-BP-028 R4']

  - id: INV-PROV-12
    statement: >
      /tmp, /var/tmp and /run are tmpfs mounted noexec, nosuid and nodev,
      confirmed from /proc/mounts on the running device.
    stage: boot
    verify:
      - check: mount-options
        params:
          mounts:
            - { path: /tmp, fstype: tmpfs, options: [noexec, nosuid, nodev] }
            - { path: /var/tmp, fstype: tmpfs, options: [noexec, nosuid, nodev] }
            - { path: /run, fstype: tmpfs, options: [noexec, nosuid, nodev] }
    rationale: >
      Scratch space holds decrypted material in the ordinary course of
      operation, and it must not survive a power cut or be executable.
    does_not_cover: >
      Anything about the state partition, which is persistent by design and not
      encrypted at the partition level (see HARDENING.md).
    standard: ['ANSSI-BP-028 R12', 'CIS Debian 1.1.2']

  # --- Removing the network, not disabling it ------------------------------
  # A LANDMINE FOR WHOEVER WIRES THE BOOT PARTITION, recorded here because this
  # is the assertion it walks into. The Pi needs GPU firmware (start4.elf,
  # fixup4.dat and the rest) on the boot partition before it will start a
  # kernel, and the obvious way to get it is Debian's `raspi-firmware`. That
  # package also installs lib/firmware/brcm/brcmfmac43455-sdio.txt and four
  # siblings, which is exactly what the absent-paths glob below forbids, so
  # installing it into the root filesystem fails this assertion.
  #
  # That is the design working rather than a conflict to route around. The boot
  # blobs live in usr/lib/raspi-firmware/ inside the .deb and are what belongs
  # on the FAT partition; the brcm files are radio firmware and belong nowhere
  # on this device. Extract, do not install.
  - id: INV-PROV-13
    statement: >
      No wireless or Bluetooth kernel module, firmware file, or userspace
      package is present in the image.
    stage: image
    verify:
      - check: absent-packages
        params:
          packages: [firmware-brcm80211, bluez, wpasupplicant, wireless-tools]
      - check: absent-paths
        params:
          # THE STATEMENT SAYS "wireless OR BLUETOOTH", and for a long time the
          # globs said neither. Only drivers/net/wireless was listed, so the
          # 802.11 stack (cfg80211, mac80211, lib80211) and every one of the 22
          # Bluetooth modules satisfied this assertion by not being looked at.
          # Found by booting the card under QEMU and asking the mounted root
          # filesystem what was in it.
          globs:
            - 'lib/modules/*/kernel/drivers/net/wireless/**'
            - 'lib/modules/*/kernel/net/wireless/**'
            - 'lib/modules/*/kernel/net/mac80211/**'
            - 'lib/modules/*/kernel/net/bluetooth/**'
            - 'lib/modules/*/kernel/drivers/bluetooth/**'
            - 'lib/firmware/brcm/**'
    rationale: >
      Disabling a radio in configuration leaves the capability present for
      whoever next edits that configuration. Removing the driver and the
      firmware means reverting a device tree overlay is not enough to bring the
      radio back.
    does_not_cover: >
      The radio hardware itself, which is still physically present and still
      attached to the SoC. Only a board without the chip gives physical
      certainty.
    standard: ['ANSSI-BP-028 R9']

  # THIS ASSERTION USED TO BE FALSE, and it is worth saying how rather than
  # quietly fixing it. It read "zero sockets listen on any address family other
  # than AF_UNIX", which no device that boots can satisfy: the kiosk loads
  # http://127.0.0.1:5180/ and nullroute-bridge.service answers it, because a
  # browser cannot be pointed at a Unix socket. So the profile asserted the
  # negation of a thing the image is built to do.
  #
  # It survived because the verifier was unwritten. An assertion nothing runs
  # is not weakly checked, it is unchecked, and it can say anything at all.
  # What made it visible was sitting down to write the verifier: the honest
  # implementation could not pass, and the tempting one was to soften the
  # verifier to "nothing beyond loopback" and leave the sentence above it
  # standing. That is how a verifier ends up documenting the artifact instead
  # of testing it.
  - id: INV-PROV-15
    statement: >
      At runtime, exactly one socket listens outside AF_UNIX: the loopback
      bridge, bound to 127.0.0.1 on the pinned port. Nothing listens on a
      routable address, and nothing else listens at all.
    stage: boot
    verify:
      - check: no-listening-sockets
        params:
          # THE ALLOWANCE IS A LIST OF ONE, ENUMERATED, so that a second
          # listener is a failure rather than a judgement call. "Loopback only"
          # would pass a debug server somebody left on 127.0.0.1:9229, which is
          # the actual risk here: node's inspector binds loopback and hands over
          # the process, key material included.
          allow:
            - { address: 127.0.0.1, port: 5180, why: nullroute-bridge.service serves the frontend }
    rationale: >
      This is INV-NET-1 checked at the layer below the application. The lint
      rule proves no source file in packages/ can open a socket; this proves
      nothing on the running device has, whatever its source.

      The one permitted listener is the narrowest thing that lets a browser
      reach a daemon that holds keys on a Unix socket it cannot be pointed at.
      It binds 127.0.0.1 rather than a wildcard, which is the property that
      matters and is separately asserted in daemon.bridge.
    does_not_cover: >
      Outbound connections, which are separately prevented by there being no
      route and no configured interface.

      It also says nothing about what the permitted listener SERVES. A bridge
      bound correctly to loopback and answering anything asked of it would
      satisfy this assertion completely. What it may answer is daemon.bridge's
      subject, not this one.

  - id: INV-PROV-16
    statement: >
      No network-configuration daemon, time-synchronisation daemon, SSH server,
      cron daemon, audit daemon or firewall package is installed.
    stage: image
    verify:
      - check: absent-packages
        params:
          packages:
            [
              openssh-server,
              chrony,
              systemd-timesyncd,
              ntp,
              cron,
              at,
              auditd,
              ufw,
              nftables,
              dhcpcd-base,
              avahi-daemon,
            ]
    rationale: >
      Each of these is a service with a parser, a configuration file and a CVE
      history, present on this device for no reason. The time daemons are worse
      than useless here: they would require a network and would contradict the
      rule that nothing cryptographic depends on wall time.
    does_not_cover: >
      Equivalent functionality statically linked into another binary, which
      package-level absence cannot see.

  - id: INV-PROV-17
    statement: >
      /dev/rtc0 is absent and no unit is ordered after time-sync.target.
    stage: boot
    verify:
      - check: absent-paths
        params: { globs: ['/dev/rtc0'] }
      - check: no-unit-ordering
        params: { after: time-sync.target }
    rationale: >
      The board has no battery-backed clock, so wall time after a power cut is
      arbitrary. Any code that trusts it is wrong, and rate limiting uses
      monotonic time for that reason. A systemd DevicePolicy that silently
      grants char-rtc access would undermine this quietly.
    does_not_cover: >
      Application logic that derives a timestamp from user input or from an
      imported snapshot, which is the wallet layer's problem.

  # --- Process isolation ---------------------------------------------------
  - id: INV-PROV-23
    statement: >
      Every unit the image ships can start: the program its ExecStart names and
      the account it runs as are both present in the image.
    stage: image
    verify:
      - check: unit-executables
        params:
          units:
            - nullroute-state.service
            - nullroute-attest.service
            - nullroute-harden-run.service
            - nullrouted.service
            - nullroute-bridge.service
            - nullroute-runtime-facts.service
            - nullroute-kiosk.service
    rationale: >
      INV-PROV-18 and INV-PROV-19 measure DECLARED directives, so
      systemd-analyze will score a unit whose ExecStart names a file that is not
      in the image. That is what this profile was doing. The signing daemon was
      certified at an exposure of 0.5 while /usr/lib/nullroute/bin/node, its
      main.js, /usr/bin/chromium and the users nullroute and nullroute-ui were
      all absent, which is the sandbox of a process that cannot exist. A unit
      that cannot start is not a hardened unit, it is a boot failure on a device
      with no console anybody is watching.
    does_not_cover: >
      That the program runs. A truncated binary, one built for another
      architecture, or one whose own dependencies are missing passes this: the
      check is that the path resolves inside the artifact. It also reads the
      unit files that ship and does not follow drop-ins under
      systemd/system/<unit>.d/ that could override ExecStart.

  - id: INV-PROV-24
    statement: >
      The setuid helper Chromium's own sandbox requires is present, owned by
      root, and mode 4755.
    stage: image
    verify:
      - check: file-modes
        params:
          files:
            - { path: /usr/lib/chromium/chrome-sandbox, mode: '4755', uid: 0 }
    rationale: >
      INV-PROV-19 lets the kiosk unit score 3.0 where the daemon is held to 0.5,
      and its own comment says the trade is made specifically so that Chromium
      can keep its own sandbox: the directives that would harden the unit force
      --no-sandbox, and an unsandboxed browser is worse than a higher exposure
      number. That reasoning is only worth anything if the sandbox exists.

      It did not. Debian ships the helper in a separate `chromium-sandbox`
      package, the image installed `chromium` alone, and the browser aborted on
      every boot with "No usable sandbox". The image was paying the exposure
      price and getting nothing for it, and the assertion that documented the
      trade had no way to notice.
    does_not_cover: >
      Whether the bit is honoured at runtime. A partition mounted nosuid ignores
      a setuid bit that is present, and an unbooted image cannot show that. It
      also says nothing about whether Chromium's sandbox is effective, only that
      the binary it refuses to start without is there and executable as root.

  - id: INV-PROV-18
    statement: >
      The signing daemon unit scores at most 0.5 under
      `systemd-analyze security --offline=true` with the pinned systemd version.
    stage: image
    verify:
      - check: systemd-exposure
        tool: systemd-analyze
        params: { unit: nullrouted.service, max_exposure: 0.5 }
    rationale: >
      The daemon holds key material and talks to one Unix socket and one device
      node. There is no reason for it to retain any capability, any address
      family beyond AF_UNIX, or any view of the rest of the filesystem.
    does_not_cover: >
      What the binary does inside the sandbox. This measures DECLARED
      directives, not enforced behaviour: it is a configuration linter, and its
      number is not a security measurement. The score is also coupled to the
      systemd version, whose weights change between releases, which is why that
      version is pinned and recorded.
    standard: ['ANSSI-BP-028 R70']

  - id: INV-PROV-19
    statement: >
      The kiosk unit scores at most 3.0, and the documentation states that it is
      the weakest component on the device.
    stage: image
    verify:
      - check: systemd-exposure
        tool: systemd-analyze
        params: { unit: nullroute-kiosk.service, max_exposure: 3.0 }
      # NOT documented-weakness, which is the meta rule about `does_not_cover`
      # and takes no parameters. It was named here with a `document` and a
      # `claim` that nothing in the repository read, so this half of the
      # assertion reported a pass without opening anything, and the document it
      # named is not the one the sentence is in.
      - check: documented-claim
        params:
          document: provisioning/HARDENING.md
          contains: 'The browser is the weakest component on the device.'
    rationale: >
      Chromium's own sandbox needs unprivileged user namespaces, so the
      directives that make the daemon safe force --no-sandbox, which is a net
      loss. The asymmetry is permanent and roughly sixfold. Averaging the two
      scores would hide the one number a reader should take away.
    does_not_cover: >
      Any claim that the browser is adequately hardened. It is not, and the
      design response is to keep trust out of it rather than to harden it
      further.

  - id: INV-PROV-25
    statement: >
      The display this device is built around is enabled by its boot
      configuration: config.txt names the overlay that describes the official
      Raspberry Pi 7 inch DSI touchscreen.
    stage: image
    verify:
      - check: boot-config-display
        params:
          # ONE OVERLAY, NOT TWO. This asked for vc4-kms-v3d as well, which is a
          # Raspberry Pi OS habit: their base tree needs it to turn KMS on.
          # Debian ships mainline, where the GPU node is already at status okay,
          # so /dev/dri/card0 exists without it and there is no such overlay in
          # this image to name. Requiring it would have been requiring something
          # unnecessary and unobtainable, which is a check nobody can satisfy
          # rather than a check that holds.
          overlays:
            - nullroute-7inch-dsi
    rationale: >
      This product is a screen with a signer behind it, and the screen is always
      the official 7 inch panel. Decompiling the device tree the image ships
      says dsi@7e700000 is disabled, no node describes the panel, and no node
      describes its touch controller, while the GPU node is enabled. So cage
      starts, finds a card, and draws onto nothing: the panel is dark and touch
      is dead. The drivers are all in the rootfs, which is exactly what made
      this look provisioned for three months.

      It went unnoticed because the profile asserted the boot files, the kernel
      command line, the units, the sockets and the mount flags, and said nothing
      about the display. An assertion nobody writes cannot fail.
    does_not_cover: >
      Whether the panel actually lights up. This reads config.txt and says the
      overlay is named; it does not say that the overlay describes the right
      I2C routing for this board, or that the firmware applied it. Whether the
      .dtbo is on the card is INV-PROV-26. Debian ships mainline device trees, which lack the
      labels the Raspberry Pi overlays are written against, so the overlay this
      names still has to come from somewhere and be proven on the hardware. Only
      a boot with the panel attached answers that, and nothing in this
      repository can.

  - id: INV-PROV-26
    statement: >
      Every overlay config.txt tells the firmware to load is present on the boot
      partition and is a device tree blob.
    stage: image
    verify:
      - check: boot-overlays-present
        params:
          partition: boot
    rationale: >
      The firmware reads dtoverlay= out of config.txt, looks for the matching
      file under overlays/, and if it is not there carries on booting without
      saying anything. Nothing reports an error. The device comes up, the daemon
      runs, and the panel stays dark, which on a product that is a screen with a
      signer behind it is the whole device failing quietly.

      INV-PROV-25 pins the text of config.txt and INV-PROV-22 pins the file
      list, so changing either one alone is caught. Neither catches the edit
      that removes the overlay and its line from the profile together, which is
      what tidying up an overlay somebody believed was unused looks like. This
      asserts the relation between the two directly, read off the card, so it
      holds without either pin being maintained.

      It reads config.txt from the boot partition rather than the copy left in
      the root filesystem, because that is the file the firmware reads.
    does_not_cover: >
      That the overlay applies. A .dtbo present and well formed can still target
      labels the base device tree does not have, which is a real risk here
      because Debian ships mainline trees and the Raspberry Pi overlays are
      written against theirs. That is answered at build time rather than here:
      build-system.sh merges this overlay into the bcm2711-rpi-4-b.dtb the image
      ships with fdtoverlay, then reads the result back and refuses to build
      unless dsi@7e700000 came out okay and the merged tree carries both the
      panel and its touch controller. Whether the panel then lights up is
      answered only by a boot with the panel attached, and nothing in this
      repository can do it.

  # --- The camera ------------------------------------------------------------
  # A USB (UVC) webcam, and not a Raspberry Pi CSI camera module. The pinned
  # kernel, linux-image-6.12.94+deb13-arm64, has CONFIG_VIDEO_BCM2835_UNICAM
  # and CONFIG_VIDEO_IMX219 not set and no IMX708 driver at all, so no CSI
  # camera can work on this image; CONFIG_USB_VIDEO_CLASS=m (uvcvideo) is
  # built. research/pi-boards.md has the detail.
  #
  # The four assertions below are the four links a camera frame passes through
  # before the frontend sees it, each of which fails quietly: the device
  # manager that loads the driver and sets the node's group, the driver, the
  # kiosk's device cgroup, and the browser's permission. What none of them can
  # establish, and what ONLY HARDWARE ANSWERS, is a camera plugged into a Pi
  # actually streaming frames into the scan screen. That has not happened yet.
  - id: INV-PROV-27
    statement: >
      The kiosk unit's device cgroup is closed and allows exactly the panel, the
      input devices and the video4linux class, and it loads videodev before it
      starts so that the video4linux class exists to be allowed.
    stage: image
    verify:
      - check: unit-device-allow
        params:
          unit: nullroute-kiosk.service
          policy: closed
          # The whole list, so an entry added beside the camera's is a failure
          # rather than a pass.
          allow:
            - /dev/dri/card0 rw
            - /dev/dri/renderD128 rw
            - char-input r
            - char-video4linux rw
          modules:
            char-video4linux: videodev
    rationale: >
      The browser reads QR codes from the camera, and DevicePolicy=closed
      refuses every device node the unit does not list, whatever its file mode.
      One class was added for the camera and the check is exact so that nothing
      else came with it. systemd.resource-control(5) says a device group absent
      from /proc/devices when the unit starts is silently left out of the allow
      list, and video4linux is only there once videodev is loaded, so the unit
      loads it with modprobe@videodev.service first.
    does_not_cover: >
      What the kernel enforced. This reads declared directives; whether the
      running cgroup lets the browser open /dev/video0 is only visible on a
      device with a camera plugged in, and that has not been observed. Drop-ins
      under systemd/system/<unit>.d/ are not followed.

  - id: INV-PROV-28
    statement: >
      Chromium's managed policy directory holds exactly one file, and it grants
      video capture without a prompt to http://127.0.0.1:5180 alone and turns
      audio capture off.
    stage: image
    verify:
      - check: browser-policy-exact
        params:
          directory: /etc/chromium/policies/managed
          files:
            nullroute.json:
              VideoCaptureAllowed: false
              VideoCaptureAllowedUrls: ['http://127.0.0.1:5180']
              AudioCaptureAllowed: false
    rationale: >
      In kiosk mode getUserMedia raises a permission prompt that nothing on the
      device can reliably answer. VideoCaptureAllowed false turns prompts off and
      leaves capture available only to the origins in VideoCaptureAllowedUrls,
      which is the loopback origin the kiosk loads. Chromium merges every file in
      the directory, so a second file could widen the list while this one still
      read correctly, which is why the directory is checked whole.
    does_not_cover: >
      That Chromium read the policy. Whether it is in force shows at
      chrome://policy on a running device, which has not been looked at. The
      recommended policy directory is not examined, though a managed value wins
      over a recommended one for the same key.

  - id: INV-PROV-29
    statement: >
      The uvcvideo kernel module, and every module the image's modules.dep says
      it depends on, is present in the root filesystem.
    stage: image
    verify:
      - check: kernel-modules-present
        params:
          modules: [uvcvideo]
    rationale: >
      uvcvideo is the driver for every USB Video Class webcam, which is the
      camera this device supports. The build deletes whole module trees to
      remove the radios, and a prune that reached drivers/media or drivers/usb
      would take the camera with it and nothing else would say so. Reading the
      dependency list from modules.dep checks what modprobe will actually try to
      load, rather than a list that is right for one kernel.
    does_not_cover: >
      That the module loads, binds to a particular webcam, or produces frames.
      Only a Pi with a camera plugged in answers that, and none has been tried.
      It also says nothing about whether anything loads the module on hotplug,
      which is INV-PROV-30.

  # Written before the fix and seen to fail against the image built without
  # udev, for the same reason INV-PROV-25 was: a camera path that is right in
  # every other respect is still dead without it, and an assertion nobody writes
  # cannot fail. build-system.sh now includes udev.
  - id: INV-PROV-30
    statement: >
      The device manager is in the image, and its rules give video4linux device
      nodes the video group and load drivers for hardware that announces a
      modalias, so a webcam plugged in gets uvcvideo and a node the kiosk can
      open.
    stage: image
    verify:
      - check: udev-rules
        params:
          daemon: /usr/lib/systemd/systemd-udevd
          rules:
            - { match: 'SUBSYSTEM=="video4linux"', assigns: 'GROUP="video"' }
            - { match: 'ENV{MODALIAS}=="?*"', assigns: 'RUN{builtin}+="kmod load"' }
    rationale: >
      Without a device manager the kernel's devtmpfs creates /dev/video0 owned by
      root with mode 0600, so the kiosk's membership of the video group opens
      nothing, and nothing acts on the modalias a webcam announces, so uvcvideo
      is never loaded for it. The two rule lines are the ones systemd's udev
      ships for exactly these jobs, in 50-udev-default.rules and
      80-drivers.rules.
    does_not_cover: >
      udev's rule semantics. It matches rule text, so a later rule reassigning
      the group, or a GOTO skipping the line, is not seen. It does not show that
      a node on a running device has the group; only a Pi with a camera plugged
      in shows that.

  - id: INV-PROV-22
    statement: >
      The boot partition holds exactly the pinned set of files and no others.
    stage: image
    verify:
      - check: boot-files-exact
        params:
          partition: boot
          # THE FULL SET, not a minimum. On the one partition the hash tree does
          # not cover, an addition is the direction that matters, and a check
          # that only confirms presence cannot fail on one.
          #
          # It is one file today because the boot partition carries one file
          # today: there is no firmware, no kernel and no initramfs yet, and
          # `make image` refuses for that reason. Each of those is a line added
          # here by whoever puts it on the card, which is the intended cost.
          files:
            - cmdline.txt
            - config.txt
            - kernel8.img
            # Only the boards `boards:` above claims. Debian's 6.12 kernel ships
            # exactly four Pi device trees and no bcm2712-rpi-cm5, which is why
            # raspberrypi-cm5 is no longer in that list.
            - bcm2711-rpi-4-b.dtb
            # Pi 4 loads these from the card.
            - start4.elf
            - fixup4.dat
            # The dm-verity root hash the initramfs opens the system partition
            # with. It lives here rather than in the kernel command line so that
            # INV-PROV-21 can keep pinning that line exactly; this number changes
            # whenever the system partition's contents do.
            - system.roothash
            # Opens the verity mapping and pivots onto it. `make image-boot-test`
            # boots this under QEMU and requires that a card with one byte
            # changed inside the system partition fails.
            - initramfs.img
            # The directory holding the panel overlay, and what is inside it.
            # The verifier follows the directory's cluster chain, so both the
            # directory and each name within it are accounted for here. It read
            # the root directory only until this landed, which meant a file
            # added inside overlays/ was seen by nothing at all, on the one
            # partition dm-verity does not cover.
            - overlays
            # Compiled from provisioning/build/overlays/nullroute-7inch-dsi.dts,
            # which is in MANIFEST.lock. config.txt names it in a dtoverlay=
            # line that INV-PROV-25 pins, so the two now have to agree: the
            # overlay the firmware is told to load is the overlay that is here.
            - overlays/nullroute-7inch-dsi.dtbo
    rationale: >
      Every other region of the card is under the dm-verity hash tree. This one
      cannot be, because it is where the firmware reads the root hash from. An
      attacker who rewrites it supplies their own initramfs and their own
      roothash= and the device displays the number they chose, which is why the
      threat model says tier 1 moves the OS integrity problem rather than
      closing it. Knowing exactly what is on the unprotected partition does not
      fix that and is the strongest thing available below a signed boot chain.
    does_not_cover: >
      What is inside those files. The check reads names, so a substituted
      initramfs of the same name passes it, and only tier 2 answers that. It
      descends one level, which is what covers `overlays/`. A directory nested
      inside a directory would be reported by name with its contents unread.

  - id: INV-PROV-21
    statement: >
      The kernel command line inside the artifact matches the pinned token set
      exactly and contains no `lockdown=` token.
    stage: image
    verify:
      - check: cmdline-exact
        params:
          # The pinned set, written out here because "exactly as pinned" with
          # nothing pinned is an assertion that cannot fail. tools/verify-image
          # caught that on its first run against a rootfs: the check was
          # declared, the parameter was absent, and the verifier had nothing to
          # compare against.
          #
          # No `lockdown=`: see the rationale. No `quiet`: a device whose whole
          # claim is that you can watch it verify itself should not hide its
          # boot. No `init=`: the only thing it could do here is replace the
          # init this image was built with.
          cmdline: >-
            console=tty1
            root=/dev/mmcblk0p2
            rootfstype=erofs
            ro
            rootwait
            fsck.repair=no
            systemd.unified_cgroup_hierarchy=1
    rationale: >
      Pinning the whole command line rather than checking for the presence of
      individual tokens catches additions as well as removals. `lockdown=` is
      explicitly excluded because it is a no-op on stock Raspberry Pi kernels,
      which do not build CONFIG_SECURITY_LOCKDOWN_LSM, and a parameter that
      does nothing reads to a later maintainer as a protection that exists.
    does_not_cover: >
      The command line the firmware actually read, which lives on the boot
      partition and is only covered once the boot chain is signed.

excluded_controls:
  - family: MemoryDenyWriteExecute on the signing daemon
    control_count: 1
    reason: >
      This was an assertion until a measurement retired it, and it is here
      rather than deleted because a control this strong being absent is
      something a reader should find written down.

      It is the single most effective directive systemd offers and it crashes
      Node outright: V8's baseline compiler needs writable-then-executable
      pages. It works under `node --jitless`, which the assertion required, and
      that was described as an acceptable trade for a workload that is not
      throughput bound. It is not one. The wallet store stretches its passphrase
      with Argon2id from @noble/hashes, which is pure JavaScript, and an
      interpreter with no JIT runs it about fifty times slower. Measured at the
      shipped parameters of 64 MiB and three passes: 643ms with the JIT and 34.4
      seconds without, on a machine considerably faster than a Pi.

      Adopting it now costs one of three things: minutes per unlock attempt, a
      much weaker key derivation, or a native or WASM Argon2 and the supply
      chain review that comes with it. None is obviously right. The constant
      time re-validation problem also still applies, because the interpreter
      takes different code paths through the crypto layer.

      provisioning/units/nullrouted.service says the same thing at the point
      where somebody would otherwise add the directive back.

  - family: Audit daemon (auditd)
    control_count: 55
    reason: >
      An audit trail exists to reconstruct who did what on a multi-user system.
      This device has no interactive users and one application, the logs would
      have to be written to the state partition to survive, and the
      device already keeps a hash-chained operation log at the application layer
      that records exactly the events that matter.

  - family: SSH server configuration
    control_count: 23
    reason: >
      There is no SSH server. Hardening the configuration of an absent daemon is
      the clearest possible example of a control that raises a compliance score
      without changing the attack surface.

  - family: PAM and password aging
    control_count: 42
    reason: >
      No account has a valid password hash and nothing logs in. Access control
      on this device is the PIN gate in front of the encrypted store, which is
      not a PAM concern.

  - family: Time synchronisation
    control_count: 6
    reason: >
      Applying these would require a network and a time daemon, both of which
      this device deliberately lacks. This family is not merely vacuous here, it
      is actively contrary to the design.

  - family: Firewall
    control_count: 5
    reason: >
      A firewall states that certain traffic is not permitted to leave. Having
      no configured interface, no route, and no code able to open a socket is a
      stronger statement, and adding a firewall on top would suggest the weaker
      one was the real defence.

  - family: Login banners
    control_count: 6
    reason: >
      A banner warns unauthorised users of monitoring before they log in.
      Nothing logs in.

references:
  - ANSSI-BP-028 v2.0, Recommandations de configuration d'un systeme GNU/Linux
  - CIS Debian Linux Benchmark, cited by control id where genuinely applicable
  - Reproducible Builds, https://reproducible-builds.org
  - provisioning/HARDENING.md
  - docs/VERIFICATION.md
  - docs/THREAT-MODEL.md
